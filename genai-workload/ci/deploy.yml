# .github/workflows/deploy.yml
#
# Deployment pipeline for the workload account. Four properties:
#
#  1. No long-lived AWS credentials. OIDC federation only, with the trust policy
#     pinned to this repository AND this environment.
#  2. Actions pinned to commit SHAs, not tags. A tag is mutable; a compromised
#     action repository can retag and take over every workflow that trusts it.
#  3. Secret, dependency, and template scanning gate the deployment.
#  4. Guardrail configuration changes gate on an adversarial regression suite.
#     Weakening a guardrail is not deleting it, so the permissions boundary does
#     not catch it — a failing test does.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to nothing. Each job opts in to what it needs.
permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "20"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs history

      - name: Secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci, never npm install. ci installs exactly what the lockfile pins and
      # fails when package.json and the lockfile disagree — which is the signal
      # that a dependency was changed outside review.
      - run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Template scan
        uses: bridgecrewio/checkov-action@38a95e98d734de90a74defa49b76d9c00b9d1eab # v12
        with:
          directory: infrastructure/
          framework: cloudformation
          soft_fail: false

      # cfn-guard rules encode the SCP set, so a template that would be denied at
      # deploy time fails here instead — at build time, with a readable message,
      # rather than mid-stack with a partial rollback.
      - name: Policy-as-code validation
        run: |
          cfn-guard validate \
            --rules policy/scp-equivalents.guard \
            --data infrastructure/ \
            --show-summary fail

      # Required cost allocation tags. Same reasoning: the SCP would reject the
      # stack, and rejecting here is cheaper than a partial deployment.
      - name: Required tag validation
        run: node scripts/validate-tags.mjs infrastructure/

  test:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

      # Authorizer regression. Specifically asserts that the returned policy names
      # a single method ARN — a change to a wildcard resource would cache an
      # over-broad policy against a scope-limited token and produce no visible
      # symptom in normal use.
      - name: Authorizer policy scope test
        run: npm run test:authorizer-scope

      # Tenant isolation. A tenant-A canary document must not surface in a
      # tenant-B retrieval.
      - name: Tenant isolation test
        run: npm run test:tenant-isolation

  guardrail-regression:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.GUARDRAIL_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Versioned adversarial corpus run against the guardrail version this
      # deployment would pin. Measures guardrail quality directly instead of
      # inferring it from intervention rate, which moves with attack volume
      # rather than with control effectiveness.
      - name: Adversarial corpus
        run: node scripts/guardrail-regression.mjs --corpus corpus/adversarial --min-block-rate 0.98

      # Synthetic PII markers through the full path, asserted absent downstream.
      - name: PII canary
        run: node scripts/pii-canary.mjs --assert-absent ledger,vector,telemetry

  deploy:
    needs: guardrail-regression
    runs-on: ubuntu-latest
    # The environment is what the OIDC trust policy pins against. A wildcard sub
    # condition — repo:<org>/*  — would let any branch and any fork's pull request
    # assume this role. Protection rules on the environment enforce the two-person
    # approval; the approver identity must differ from the commit author.
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.PIPELINE_EXEC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ github.sha }}
          # Session tag carries the commit SHA, so every infrastructure mutation
          # in CloudTrail resolves to a commit.
          role-session-tagging: true

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --omit=dev --ignore-scripts

      # Strip development artifacts. console.log in a Lambda writes to CloudWatch
      # in the workload account, which is the one log destination that is not
      # restricted-access — anything sensitive there is readable by anyone with
      # workload log access.
      - name: Build
        run: npm run build -- --drop:console --minify --sourcemap=external

      - name: Deploy
        run: |
          aws cloudformation deploy \
            --stack-name genai-workload \
            --template-file infrastructure/template.yaml \
            --role-arn "${{ vars.CFN_SERVICE_ROLE_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --tags costCenter=${{ vars.COST_CENTER }} \
                   environment=prod \
                   applicationId=genai-workload \
                   dataClassification=confidential \
                   owner=${{ vars.OWNER }}

      - name: Post-deploy drift baseline
        run: |
          aws cloudformation detect-stack-drift --stack-name genai-workload
