AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 20 - Log Archive account. cmk/audit, the WORM audit bucket, the Org Trail
  destination, and the delivery target for security logs from the workload
  account.

  DEPLOY TO THE LOG ARCHIVE ACCOUNT, not the workload account. The point of this
  stack is that workload principals are excluded from the key policy and the
  bucket policy - a key created by a workload-account stack cannot exclude the
  account that created it.

  Object Lock in COMPLIANCE mode cannot be shortened, disabled, or overridden by
  anyone including the root user and AWS Support. Set RetentionDays deliberately.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
  WorkloadAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
  SecurityAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
  InvestigationRoleName:
    Type: String
    Default: LogArchiveInvestigator
    Description: >
      The only role permitted to read model invocation logs. That prefix holds
      prompt and completion bodies - user content, unlike every other object in
      this bucket.
  RetentionDays:
    Type: Number
    Default: 2555
    MinValue: 1
    Description: >
      COMPLIANCE mode. Irreversible - too long cannot be corrected and accrues
      storage cost for its full duration. 2555 is seven years.
  GlacierTransitionDays:
    Type: Number
    Default: 90

Resources:

  # ==========================================================================
  # cmk/audit
  #
  # No workload-account principal appears anywhere in this policy. That absence
  # is the control: a full compromise of the workload account yields no path to
  # decrypt the record of the compromise.
  # ==========================================================================
  AuditKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ApplicationId} audit trail and model invocation logs"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

          - Sid: AllowCloudTrailEncrypt
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn:
                  !Sub "arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*"

          # Firehose in the workload account writes here. Encrypt only - the
          # delivery identity can put objects and can never read them back.
          - Sid: AllowWorkloadDeliveryEncryptOnly
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${WorkloadAccountId}:root"
            Action:
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"

          - Sid: DenyWorkloadDecrypt
            Effect: Deny
            Principal:
              AWS: !Sub "arn:aws:iam::${WorkloadAccountId}:root"
            Action:
              - kms:Decrypt
              - kms:ReEncryptFrom
            Resource: "*"

          - Sid: AllowSecurityAccountRead
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SecurityAccountId}:root"
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"

          # No principal can schedule deletion or disable this key. Without this,
          # an account administrator can render every archived log unreadable
          # without deleting a single object.
          - Sid: DenyKeyDestruction
            Effect: Deny
            Principal: "*"
            Action:
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:DisableKeyRotation
            Resource: "*"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  AuditKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ApplicationId}/${Environment}/audit"
      TargetKeyId: !Ref AuditKey

  # ==========================================================================
  # Audit bucket
  # ==========================================================================
  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ApplicationId}-${Environment}-audit-${AWS::AccountId}"
      # ObjectLockEnabled cannot be turned on after creation. Getting this wrong
      # means recreating the bucket and re-delivering every log.
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: !Ref RetentionDays
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt AuditKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: glacier-transition
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: !Ref GlacierTransitionDays
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER
                TransitionInDays: !Ref GlacierTransitionDays
          # Object Lock prevents deletion of the objects themselves; this only
          # cleans up the delete markers and multipart debris that accumulate.
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:

          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub "${AuditBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

          # Belt and braces alongside Object Lock. Object Lock is the control
          # that holds; this makes the intent legible in a policy review.
          - Sid: DenyObjectDeletion
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:PutBucketVersioning
              - s3:PutObjectRetention
              - s3:PutObjectLegalHold
              - s3:PutBucketObjectLockConfiguration
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub "${AuditBucket.Arn}/*"

          - Sid: AllowCloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceOrgID: !Ref OrganizationId

          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${AuditBucket.Arn}/AWSLogs/${OrganizationId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceOrgID: !Ref OrganizationId

          # Write-only for the workload account. It can deliver logs and can
          # never read, list, or overwrite them.
          - Sid: AllowWorkloadDeliveryWriteOnly
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${WorkloadAccountId}:root"
            Action: s3:PutObject
            Resource: !Sub "${AuditBucket.Arn}/delivery/${WorkloadAccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-server-side-encryption: aws:kms
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt AuditKey.Arn

          - Sid: DenyWorkloadRead
            Effect: Deny
            Principal:
              AWS: !Sub "arn:aws:iam::${WorkloadAccountId}:root"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub "${AuditBucket.Arn}/*"

          # Model invocation logs are user content. Everything else in this
          # bucket is metadata.
          #
          # The exception list is the named investigation role and nothing else.
          # An earlier version also exempted every role in this account, which
          # made the restriction cosmetic - "only the investigation role" has to
          # mean that, or the prefix separation buys nothing.
          #
          # Consequence to know before an incident: no local administrator can
          # read this prefix. Recovering access means assuming the investigation
          # role, which is the intended friction.
          - Sid: RestrictInvocationLogReads
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "${AuditBucket.Arn}/delivery/*/bedrock-invocations/*"
            Condition:
              StringNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${SecurityAccountId}:role/${InvestigationRoleName}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${InvestigationRoleName}"

  # ==========================================================================
  # Org Trail
  # ==========================================================================
  OrgTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub "${ApplicationId}-${Environment}-org"
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IsOrganizationTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      KMSKeyId: !GetAtt AuditKey.Arn
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          # Data events. Management events record that a bucket exists; data
          # events record who read which object out of it, which is the half
          # that matters for the vector store and the app bucket.
          DataResources:
            - Type: AWS::S3::Object
              Values: ["arn:aws:s3"]
            - Type: AWS::Lambda::Function
              Values: ["arn:aws:lambda"]
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

Outputs:
  AuditKeyArn:
    Value: !GetAtt AuditKey.Arn
    Description: Pass to the workload account as the Firehose encryption key
  AuditBucketName:
    Value: !Ref AuditBucket
  AuditBucketArn:
    Value: !GetAtt AuditBucket.Arn
  DeliveryPrefix:
    Value: !Sub "delivery/${WorkloadAccountId}/"
    Description: The only prefix the workload account may write to
  OrgTrailArn:
    Value: !GetAtt OrgTrail.Arn
