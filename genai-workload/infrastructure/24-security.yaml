AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 24 - Security account. Detection services, the alert topic every alarm in
  layer 10 points at, the containment runbook, and the sensitive-data scanning
  bucket from spec section 14.

  DEPLOY TO THE SECURITY ACCOUNT. Delegated-administrator registration for
  Security Hub, GuardDuty, Config, and Macie happens in the Management account
  first - CloudFormation cannot perform that registration, so it is a one-time
  manual or CLI step recorded in the README.

  Layer 10 references SecurityAlertTopicArn. That topic is created here, so this
  stack is a prerequisite for layer 10 despite the higher number.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
  WorkloadAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
  AlertEmail:
    Type: String
    Description: Subscribed to the security alert topic
  ScanningBucketExpiryDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 7
    Description: >
      The scanning bucket is a deliberate concentration of the sensitive data the
      rest of the architecture works to disperse - the most attractive object this
      design creates. Short lifespan and a single-principal policy are what stop
      it being the easiest target in the environment.

Resources:

  # ==========================================================================
  # Alert topic
  # ==========================================================================
  SecurityKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ApplicationId} security alerting and scanning exports"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # Alarms in the workload account publish to the topic in this account,
          # so they need the key. Encrypt only.
          - Sid: AllowOrgPublish
            Effect: Allow
            Principal: "*"
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
              StringLike:
                kms:ViaService:
                  - !Sub "sns.${AWS::Region}.amazonaws.com"
                  - !Sub "cloudwatch.${AWS::Region}.amazonaws.com"
          - Sid: AllowServicePublish
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
                - budgets.amazonaws.com
                - costalerts.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  SecurityKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ApplicationId}/${Environment}/security"
      TargetKeyId: !Ref SecurityKey

  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ApplicationId}-${Environment}-security-alerts"
      DisplayName: Security alerts
      KmsMasterKeyId: !Ref SecurityKey
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  SecurityAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SecurityAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  SecurityAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref SecurityAlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrgAccountsPublish
            Effect: Allow
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref SecurityAlertTopic
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
          - Sid: AllowServicesPublish
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
                - budgets.amazonaws.com
                - costalerts.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityAlertTopic
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref SecurityAlertTopic
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ==========================================================================
  # Detection services
  #
  # Registration as delegated administrator happens in the Management account and
  # is not expressible in CloudFormation. These resources assume it is done.
  # ==========================================================================
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      # Features, not DataSources - the two are mutually exclusive and
      # DataSources is the deprecated form.
      Features:
        - Name: S3_DATA_EVENTS
          Status: ENABLED
        # Lambda network activity monitoring. The one GuardDuty feature that
        # covers this architecture's compute directly - though note that with no
        # default route and all traffic on PrivateLink, there is little for
        # flow-log-based detection to see. Most interesting behaviour here is at
        # the application layer, which GuardDuty does not cover at all.
        - Name: LAMBDA_NETWORK_LOGS
          Status: ENABLED
        - Name: RDS_LOGIN_EVENTS
          Status: ENABLED
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Properties:
      # Off. Default-enabled standards produce hundreds of findings unrelated to
      # this workload, which is how alert fatigue starts. Enable specific
      # standards deliberately after the baseline is understood.
      EnableDefaultStandards: false
      ControlFindingGenerator: SECURITY_CONTROL
      AutoEnableControls: true
      Tags:
        costCenter: !Ref CostCenter
        environment: !Ref Environment
        applicationId: !Ref ApplicationId
        dataClassification: internal
        owner: !Ref Owner

  MacieSession:
    Type: AWS::Macie::Session
    Properties:
      Status: ENABLED
      FindingPublishingFrequency: FIFTEEN_MINUTES

  # ==========================================================================
  # Scanning bucket (spec section 14.2)
  #
  # Macie scans S3 and only S3. The DynamoDB ledger and Aurora pgvector are
  # outside its reach, so both are exported here on a schedule, scanned, and the
  # export deleted. Export consumes no read capacity and does not touch the
  # production table.
  #
  # A finding here means the guardrail redaction failed - that is the alert worth
  # paging on, not the fact that data was found.
  # ==========================================================================
  ScanningBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ApplicationId}-${Environment}-scanning-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt SecurityKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-exports
            Status: Enabled
            ExpirationInDays: !Ref ScanningBucketExpiryDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  ScanningBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScanningBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ScanningBucket.Arn
              - !Sub "${ScanningBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }
          - Sid: AllowWorkloadExportWrite
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${WorkloadAccountId}:root"
            Action: s3:PutObject
            Resource: !Sub "${ScanningBucket.Arn}/exports/*"
            Condition:
              StringEquals:
                s3:x-amz-server-side-encryption: aws:kms
          # Single-principal read. This bucket exists for the scanning role and
          # for nothing else.
          - Sid: RestrictReads
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt ScanningBucket.Arn
              - !Sub "${ScanningBucket.Arn}/*"
            Condition:
              StringNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-ScanningRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/macie.amazonaws.com/*"

  ScanningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-ScanningRole"
      Description: Reads exports for sensitive data discovery
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: scan-exports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt ScanningBucket.Arn
                  - !Sub "${ScanningBucket.Arn}/exports/*"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt SecurityKey.Arn
              - Effect: Allow
                Action:
                  - macie2:CreateClassificationJob
                  - macie2:DescribeClassificationJob
                  - macie2:ListFindings
                  - macie2:GetFindings
                Resource: "*"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # SecReadOnlyRole (spec section 7.1)
  #
  # SecurityAudit + ViewOnlyAccess, not ReadOnlyAccess. The latter grants object
  # and item reads - a security auditor needs to evaluate configuration, not read
  # customer data.
  # ==========================================================================
  SecReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-SecReadOnlyRole"
      Description: Cross-account posture evaluation
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              Bool: { "aws:MultiFactorAuthPresent": "true" }
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Containment runbook
  # ==========================================================================
  ResponseRunbookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-SecResponderRole"
      Description: Automated containment - time-limited, write-scoped
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: containment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeWorkloadContainment
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:aws:iam::${WorkloadAccountId}:role/${ApplicationId}-${Environment}-ResponseRunbookRole"
              - Sid: Notify
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref SecurityAlertTopic
              - Sid: RecordFinding
                Effect: Allow
                Action:
                  - securityhub:BatchImportFindings
                  - securityhub:BatchUpdateFindings
                Resource: "*"
              # A containment action must never be able to erase its own trace.
              - Sid: DenyAuditMutation
                Effect: Deny
                Action:
                  - kms:*
                  - backup:*
                  - cloudtrail:*
                  - s3:DeleteObject
                  - logs:DeleteLogGroup
                Resource: "*"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Event routing
  # ==========================================================================
  HighSeverityFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-high-severity"
      Description: High and critical findings to the alert topic
      EventPattern:
        source: [aws.securityhub]
        detail-type: ["Security Hub Findings - Imported"]
        detail:
          findings:
            Severity:
              Label: [HIGH, CRITICAL]
            Workflow:
              Status: [NEW]
      State: ENABLED
      Targets:
        - Id: alert
          Arn: !Ref SecurityAlertTopic

  GuardDutyFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-guardduty"
      Description: GuardDuty findings at severity 7 and above
      EventPattern:
        source: [aws.guardduty]
        detail-type: ["GuardDuty Finding"]
        detail:
          severity: [{ numeric: [">=", 7] }]
      State: ENABLED
      Targets:
        - Id: alert
          Arn: !Ref SecurityAlertTopic

  # Any Macie finding in an export is a guardrail redaction failure, not merely
  # a discovery. Routed at every severity.
  MacieFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-macie"
      Description: Sensitive data found in a scanning export
      EventPattern:
        source: [aws.macie]
        detail-type: ["Macie Finding"]
      State: ENABLED
      Targets:
        - Id: alert
          Arn: !Ref SecurityAlertTopic

Outputs:
  SecurityAlertTopicArn:
    Value: !Ref SecurityAlertTopic
    Description: Pass to layer 10 as SecurityAlertTopicArn
    Export: { Name: !Sub "${AWS::StackName}-SecurityAlertTopicArn" }
  SecurityKeyArn:
    Value: !GetAtt SecurityKey.Arn
  ScanningBucketName:
    Value: !Ref ScanningBucket
  SecReadOnlyRoleArn:
    Value: !GetAtt SecReadOnlyRole.Arn
  SecResponderRoleArn:
    Value: !GetAtt ResponseRunbookRole.Arn
