AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 08 - API Gateway REST API, REQUEST authorizer, and the regional WAF.

  REST rather than HTTP API, deliberately (spec 4.1). WAF associates with REST
  APIs only, and resource policies are a REST-only feature. Both are load-bearing
  here: the WAF enforces origin verification and per-identity rate limiting, the
  resource policy is the backstop for origin cloaking. An HTTP API would provide
  a native JWT authorizer with an audience parameter, at the cost of the two
  controls that matter more.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  DataClassification:
    Type: String
    Default: confidential
  KmsStackName:
    Type: String
  ComputeStackName:
    Type: String
  CloudFrontDistributionId:
    Type: String
    Default: PLACEHOLDER
    Description: >
      Set after layer 09. The resource policy denies any source other than this
      distribution; until it is real, deploy with the placeholder and update.
  OriginVerifySecretValue:
    Type: String
    NoEcho: true
    Description: >
      Current x-origin-verify value. Rotated by the secrets rotation function,
      which updates the CloudFront origin header and this WAF rule together.
  AuthorizerCacheSeconds:
    Type: Number
    Default: 300
    MaxValue: 3600
    Description: >
      Must stay below the Cognito access token lifetime. A revoked token remains
      accepted for up to this long - containment happens at the WAF layer, which
      is not cached.
  RateLimitPerIdentity:
    Type: Number
    Default: 500
    MinValue: 10
    Description: Requests per 5-minute window, aggregated on the tenant claim
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 90, 180, 365, 400]

Resources:

  # ==========================================================================
  # REST API
  # ==========================================================================
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}"
      Description: Guarded inference API
      EndpointConfiguration:
        Types: [REGIONAL]
      # Bound the request before the authorizer or the model sees it. The WAF
      # enforces a ceiling too; this is the second one, so a WAF rule change
      # cannot silently widen what the API accepts.
      MinimumCompressionSize: 1024
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowInvoke
            Effect: Allow
            Principal: "*"
            Action: execute-api:Invoke
            Resource: "execute-api:/*"
          # Origin cloaking backstop. The x-origin-verify header is the fast
          # check; this is what holds if the header value leaks.
          - Sid: DenyNonCloudFront
            Effect: Deny
            Principal: "*"
            Action: execute-api:Invoke
            Resource: "execute-api:/*"
            Condition:
              StringNotEquals:
                aws:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Authorizer
  #
  # REQUEST, not TOKEN. IdentitySource includes the method and resource path, so
  # the policy cache key is per-method. A TOKEN authorizer keys only on the token:
  # the first request from a scope-limited token caches a policy, and if that
  # policy names a wildcard resource, every subsequent request from that token is
  # authorized against the wildcard. The scope check stops applying with no
  # visible symptom.
  # ==========================================================================
  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-authorizer"
      RestApiId: !Ref RestApi
      Type: REQUEST
      IdentitySource: method.request.header.Authorization,context.httpMethod,context.resourcePath
      AuthorizerUri: !Sub
        - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations"
        - Arn: { "Fn::ImportValue": !Sub "${ComputeStackName}-AuthorizerFunctionArn" }
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheSeconds

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: { "Fn::ImportValue": !Sub "${ComputeStackName}-AuthorizerFunctionArn" }
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/${ApiAuthorizer}"

  # ==========================================================================
  # Resources and methods
  # ==========================================================================
  V1Resource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: v1

  InferenceResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref V1Resource
      PathPart: inference

  RetrieveResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref V1Resource
      PathPart: retrieve

  # Async job collection. GET /v1/jobs/{jobId}
  JobsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref V1Resource
      PathPart: jobs

  JobIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref JobsResource
      PathPart: "{jobId}"

  RequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      Name: validate-body-and-params
      RestApiId: !Ref RestApi
      ValidateRequestBody: true
      ValidateRequestParameters: true

  InferenceRequestModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref RestApi
      ContentType: application/json
      Name: InferenceRequest
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: InferenceRequest
        type: object
        # Rejects unexpected fields at the gateway rather than in the adapter.
        additionalProperties: false
        required: [prompt]
        properties:
          prompt: { type: string, minLength: 1, maxLength: 16000 }
          conversationId: { type: string, maxLength: 128 }

  InferenceMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref InferenceResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestValidatorId: !Ref RequestValidator
      RequestModels:
        application/json: !Ref InferenceRequestModel
      RequestParameters:
        method.request.header.X-Request-ID: true
      Integration:
        # AWS_PROXY over the Lambda service plane. Not VPC Link - that is for
        # API Gateway reaching into a VPC to an NLB, which is a different
        # direction and a different resource entirely.
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations"
          - Arn: { "Fn::ImportValue": !Sub "${ComputeStackName}-AdapterFunctionArn" }
        TimeoutInMillis: 29000

  RetrieveMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RetrieveResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestValidatorId: !Ref RequestValidator
      RequestParameters:
        method.request.header.X-Request-ID: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations"
          - Arn: { "Fn::ImportValue": !Sub "${ComputeStackName}-AdapterFunctionArn" }
        TimeoutInMillis: 29000

  # Polling reuses llm/invoke rather than introducing llm/read. Collecting the
  # result of an invocation is part of that invocation's lifecycle; a separate
  # scope would create an orphaned capability - permission to read jobs without
  # permission to create them - that corresponds to no real caller.
  #
  # The authorization that matters here is not the scope anyway. It is
  # dynamodb:LeadingKeys on the submit role: a caller can only address keys under
  # their own TENANT# prefix, so another tenant's job ID is denied at IAM before
  # the application evaluates the request. The job ID does not need to be
  # unguessable.
  JobPollMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref JobIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestParameters:
        method.request.path.jobId: true
        method.request.header.X-Request-ID: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations"
          - Arn: { "Fn::ImportValue": !Sub "${ComputeStackName}-AdapterFunctionArn" }
        TimeoutInMillis: 5000

  AdapterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: { "Fn::ImportValue": !Sub "${ComputeStackName}-AdapterFunctionArn" }
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/v1/*"

  # ==========================================================================
  # Deployment and stage
  # ==========================================================================
  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [InferenceMethod, RetrieveMethod, JobPollMethod]
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub "Deployed by ${AWS::StackName}"

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${ApplicationId}-${Environment}/access"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref Environment
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        # Authorizer context, not request headers. These values are populated by
        # API Gateway and cannot be influenced by the caller.
        Format: >-
          {"requestId":"$context.requestId",
          "xRequestId":"$context.request.header.X-Request-ID",
          "ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod",
          "path":"$context.resourcePath",
          "status":"$context.status",
          "latency":"$context.responseLatency",
          "sub":"$context.authorizer.sub",
          "clientId":"$context.authorizer.clientId",
          "tenantId":"$context.authorizer.tenantId",
          "delegated":"$context.authorizer.delegated",
          "audience":"$context.authorizer.audience",
          "certBound":"$context.authorizer.certBound",
          "authorizerError":"$context.authorizer.error"}
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: ERROR
          # Off. Request and response bodies carry prompt content, and this log
          # group is in the workload account - the one log destination that is
          # not restricted-access.
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Regional WAF
  # ==========================================================================
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-regional"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ApplicationId}-${Environment}-regional"
      Rules:

        # Priority 0. Proves the request transited CloudFront. Evaluated before
        # anything else so a direct-to-API-Gateway request is rejected without
        # consuming managed rule capacity.
        - Name: origin-verify
          Priority: 0
          Action:
            Block:
              CustomResponse: { ResponseCode: 403 }
          Statement:
            NotStatement:
              Statement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader: { Name: x-origin-verify }
                  PositionalConstraint: EXACTLY
                  SearchString: !Ref OriginVerifySecretValue
                  TextTransformations:
                    - { Priority: 0, Type: NONE }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: origin-verify

        # Per-identity rate limit, aggregated on the tenant claim rather than on
        # source IP. IP aggregation buckets every caller behind a corporate NAT
        # or an MCP server together; the tenant claim is the only value that
        # distinguishes them. Falls back to IP when the header is absent.
        - Name: rate-limit-per-tenant
          Priority: 1
          Action:
            Block:
              CustomResponse: { ResponseCode: 429 }
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerIdentity
              EvaluationWindowSec: 300
              AggregateKeyType: CUSTOM_KEYS
              CustomKeys:
                - Header:
                    Name: authorization
                    TextTransformations:
                      - { Priority: 0, Type: NONE }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-tenant

        - Name: aws-common
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                # Prompts routinely exceed the default body-size rule and trip
                # it. Body size is bounded by the API Gateway model and by the
                # adapter instead.
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Allow: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common

        - Name: aws-bad-inputs
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-bad-inputs

        # Populated by the response runbook when a caller repeatedly trips the
        # guardrail. Containment lands here rather than on token revocation,
        # because a revoked token stays valid until the authorizer cache lapses
        # and this layer is not cached.
        - Name: blocked-identities
          Priority: 4
          Action: { Block: {} }
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt BlockedIdentitySet.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: blocked-identities

      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  BlockedIdentitySet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-blocked"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: []
      Description: Populated by the EventBridge containment runbook

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${RestApi}/stages/${Stage}"
      WebACLArn: !GetAtt WebAcl.Arn

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # WAF requires the aws-waf-logs- prefix. A different name is rejected at
      # association time with a generic error.
      LogGroupName: !Sub "aws-waf-logs-${ApplicationId}-${Environment}-regional"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  WafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs: [!GetAtt WafLogGroup.Arn]
      RedactedFields:
        # The bearer token would otherwise be logged in full on every blocked
        # request, in a workload-account log group.
        - SingleHeader: { Name: authorization }
        - SingleHeader: { Name: x-origin-verify }

Outputs:
  RestApiId:
    Value: !Ref RestApi
    Export: { Name: !Sub "${AWS::StackName}-RestApiId" }
  ApiEndpoint:
    Value: !Sub "${RestApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export: { Name: !Sub "${AWS::StackName}-ApiEndpoint" }
  StageName:
    Value: !Ref Stage
    Export: { Name: !Sub "${AWS::StackName}-StageName" }
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
    Export: { Name: !Sub "${AWS::StackName}-WebAclArn" }
