AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 22 - Shared Services account. cmk/pipeline, artifact bucket, GitHub OIDC
  provider, and the delivery roles from spec section 7.2.

  DEPLOY TO THE SHARED SERVICES ACCOUNT. The target-account half (CfnDeploymentRole
  and CfnServiceRole) deploys separately via 22b-deployment-roles.yaml into each
  target account, because a role must be created in the account it acts on.

  Three roles rather than one, deliberately: CfnDeploymentRole can start a stack
  operation but holds no service permissions of its own, and CfnServiceRole holds
  the permissions but can only be exercised by CloudFormation. A compromise of the
  pipeline yields the ability to deploy a reviewed template, not the ability to
  call arbitrary APIs.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
  GitHubOrg:
    Type: String
  GitHubRepo:
    Type: String
  GitHubEnvironment:
    Type: String
    Default: prod
    Description: >
      GitHub Actions environment name. The trust policy pins sub to
      repo:<org>/<repo>:environment:<env>. A wildcard like repo:<org>/* would let
      any branch - and any fork opening a pull request - assume this role. This
      is the most common failure in OIDC pipeline configurations.
  DeploymentBoundaryArn:
    Type: String
    Default: ""
    Description: Optional. Leave empty on first deploy, then set to the created boundary ARN.

Conditions:
  HasBoundary: !Not [!Equals [!Ref DeploymentBoundaryArn, ""]]

Resources:

  # ==========================================================================
  # cmk/pipeline
  # ==========================================================================
  PipelineKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ApplicationId} build artifacts"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # Target accounts read artifacts during deployment. Decrypt only -
          # a target account cannot write an artifact.
          - Sid: AllowTargetAccountRead
            Effect: Allow
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
                kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  PipelineKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ApplicationId}/${Environment}/pipeline"
      TargetKeyId: !Ref PipelineKey

  # ==========================================================================
  # Artifact bucket
  # ==========================================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ApplicationId}-${Environment}-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt PipelineKey.Arn
            BucketKeyEnabled: true
      # Versioning is a rollback control here: an artifact key is the commit SHA,
      # so a deployed function is traceable to a reviewed commit.
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }
          # Target accounts read. They never write - an artifact originates in
          # the build, not in the account it deploys to.
          - Sid: AllowTargetAccountRead
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
          - Sid: DenyTargetAccountWrite
            Effect: Deny
            NotPrincipal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub "${ArtifactBucket.Arn}/*"

  # ==========================================================================
  # GitHub OIDC
  # ==========================================================================
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Thumbprints are no longer verified for this provider - AWS uses a trusted
      # root CA library. The value is required by the API and is the historical
      # GitHub thumbprint.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Permissions boundary
  #
  # Attached to every delivery role. Denies the pipeline the ability to escalate:
  # it cannot detach this boundary, mint a role without it, create IAM users or
  # access keys, touch audit or backup resources, or delete the guardrail.
  #
  # Note what is NOT denied: modifying the guardrail. Weakening is not deleting,
  # and a boundary cannot express "may update but not weaken". That gap is closed
  # by the adversarial regression gate in the pipeline, not here.
  # ==========================================================================
  DeploymentBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ApplicationId}-${Environment}-DeploymentBoundary"
      Description: Permissions boundary for pipeline and deployment roles
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowServiceActions
            Effect: Allow
            Action: "*"
            Resource: "*"
          - Sid: DenyBoundaryEscape
            Effect: Deny
            Action:
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
              - iam:CreateUser
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
            Resource: "*"
          - Sid: DenyRoleCreationWithoutBoundary
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:AttachRolePolicy
            Resource: "*"
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${ApplicationId}-${Environment}-DeploymentBoundary"
          - Sid: DenyAuditAndBackupMutation
            Effect: Deny
            Action:
              - backup:DeleteRecoveryPoint
              - backup:DeleteBackupVault
              - backup:PutBackupVaultLockConfiguration
              - backup:UpdateRecoveryPointLifecycle
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - s3:PutBucketObjectLockConfiguration
              - s3:PutObjectRetention
            Resource: "*"
          - Sid: DenyKeyDestruction
            Effect: Deny
            Action:
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:DisableKeyRotation
              - kms:PutKeyPolicy
            Resource: "*"
          - Sid: DenyGuardrailDeletion
            Effect: Deny
            Action:
              - bedrock:DeleteGuardrail
            Resource: "*"
          - Sid: DenyOrganizationsAndDetectiveControls
            Effect: Deny
            Action:
              - organizations:*
              - guardduty:Delete*
              - guardduty:Disassociate*
              - securityhub:Disable*
              - config:Delete*
              - config:Stop*
              - macie2:Disable*
            Resource: "*"

  # ==========================================================================
  # GitHubOIDCRole
  # ==========================================================================
  GitHubOidcRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-GitHubOIDCRole"
      Description: Assumed by GitHub Actions via OIDC federation
      PermissionsBoundary: !If [HasBoundary, !Ref DeploymentBoundaryArn, !Ref AWS::NoValue]
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Repository AND environment. Both. Either alone is insufficient.
                token.actions.githubusercontent.com:sub:
                  !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: build-and-stage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteArtifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ArtifactKey
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt PipelineKey.Arn
              - Sid: AssumePipelineExec
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !GetAtt PipelineExecRole.Arn
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # PipelineExecRole
  # ==========================================================================
  PipelineExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-PipelineExecRole"
      Description: Orchestrates deployment into target accounts
      PermissionsBoundary: !If [HasBoundary, !Ref DeploymentBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [codepipeline.amazonaws.com, codebuild.amazonaws.com]
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-GitHubOIDCRole"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ArtifactKey
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt PipelineKey.Arn
              # The only cross-account capability. It cannot call service APIs in
              # a target account - only assume the role that starts a stack
              # operation there.
              # Wildcard on the account only. The role NAME is fixed, and the
              # org-membership condition bounds which accounts qualify - building
              # an exact per-account list from a CommaDelimitedList is not
              # expressible in CloudFormation without a custom resource.
              - Sid: AssumeDeploymentRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:aws:iam::*:role/${ApplicationId}-${Environment}-CfnDeploymentRole"
                Condition:
                  StringEquals:
                    aws:ResourceOrgID: !Ref OrganizationId
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

Outputs:
  PipelineKeyArn:
    Value: !GetAtt PipelineKey.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Description: Pass to layer 07 as ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
  DeploymentBoundaryArn:
    Value: !Ref DeploymentBoundary
    Description: Re-run this stack with DeploymentBoundaryArn set to this value
  GitHubOidcRoleArn:
    Value: !GetAtt GitHubOidcRole.Arn
    Description: role-to-assume in the GitHub Actions workflow
  PipelineExecRoleArn:
    Value: !GetAtt PipelineExecRole.Arn
  OidcProviderArn:
    Value: !Ref GitHubOidcProvider
