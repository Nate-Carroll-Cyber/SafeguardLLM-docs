AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 05 - Cognito user pool, resource server, and two app clients (spec 4.2).

  Human callers use authorization code + PKCE. Machine callers (MCP tool
  invocations) use client_credentials against the resource server. Same pool,
  same issuer, same signing key - different claim shapes, which is why the
  authorizer in layer 07 runs two verifiers, one per client set.

  Both verify access tokens only. ID tokens are never accepted at the API: they
  carry no scope, and authorization comes from scope rather than from proof of
  authentication.

  Feature plan is ESSENTIALS, not LITE. The V3_0 pre token generation trigger -
  the only version that fires for client_credentials - requires Essentials or
  Plus. On LITE the trigger silently never fires for M2M and the tenant claim
  never appears, which surfaces as a 403 with no obvious cause.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  DataClassification:
    Type: String
    Default: confidential
  DataStackName:
    Type: String
    Description: Stack name of 04-data, for the entitlement table
  CallbackUrls:
    Type: CommaDelimitedList
    Description: Exact redirect URIs for the human app client. No wildcards.
  LogoutUrls:
    Type: CommaDelimitedList
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9-]{3,63}$"
  ApiResourceIdentifier:
    Type: String
    Description: >
      RFC 8707 resource indicator for the inference API, e.g.
      https://api.example.com. The human client sends this as the `resource`
      parameter at /oauth2/authorize and Cognito sets it as the access token's
      aud claim. Must be a URL: https://, http://localhost, or a custom scheme.
    AllowedPattern: "^(https://|http://localhost|[a-z][a-z0-9+.-]*://).+$"
  AccessTokenMinutes:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 60
    Description: >
      Held short deliberately. A revoked token stays accepted until both this
      expires and the authorizer cache TTL lapses; containment happens at the
      WAF layer, which is not cached.

Resources:

  # ==========================================================================
  # Pre token generation trigger
  #
  # Derives the tenant claim SERVER-SIDE from an entitlement lookup keyed on the
  # app client ID. It deliberately ignores any tenant value in aws_client_metadata.
  #
  # This is the resolution of the open provenance question. Cognito passes
  # aws_client_metadata from the client_credentials request straight through to
  # this trigger - so a tenant read from that metadata is a value the caller
  # chose. Reading it would make the claim an assertion; deriving it makes the
  # claim a fact. The authorizer re-checks entitlement anyway, because a claim
  # minted here is still just a claim by the time it reaches the API.
  # ==========================================================================
  PreTokenGenRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-PreTokenGenRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: entitlement-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEntitlementOnly
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub
                  - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}"
                  - Table: { "Fn::ImportValue": !Sub "${DataStackName}-EntitlementTableName" }
              - Sid: DenyEntitlementWrite
                Effect: Deny
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: "*"
              - Sid: OwnLogGroupOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationId}-${Environment}-pre-token-gen:*"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  PreTokenGenLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-pre-token-gen"
      RetentionInDays: 90

  # Not VPC-attached. It is invoked by Cognito on the service plane and reaches
  # DynamoDB over the public endpoint, so its lookup cannot carry aws:SourceVpce.
  # Documented exception to the data perimeter (spec section 8) - compensated by
  # the resource-scoped policy above and the explicit write Deny.
  PreTokenGenFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-pre-token-gen"
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt PreTokenGenRole.Arn
      Timeout: 5
      MemorySize: 256
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          ENTITLEMENT_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-EntitlementTableName" }
      Code:
        ZipFile: |
          // Placeholder. Replace via the pipeline with a versioned artifact.
          // Contract:
          //   V3_0 event, request.clientMetadata may be present and is IGNORED.
          //   Tenant is read from the entitlement table keyed on
          //   event.callerContext.clientId.
          import { DynamoDBClient } from "@aws-sdk/client-dynamodb";
          import { DynamoDBDocumentClient, GetCommand } from "@aws-sdk/lib-dynamodb";
          const ddb = DynamoDBDocumentClient.from(new DynamoDBClient({}));
          export const handler = async (event) => {
            const clientId = event.callerContext?.clientId;
            const { Item } = await ddb.send(new GetCommand({
              TableName: process.env.ENTITLEMENT_TABLE,
              Key: { clientId },
              ProjectionExpression: "defaultTenant",
              ConsistentRead: true,
            }));
            if (!Item?.defaultTenant) return event; // no claim rather than a wrong one
            event.response = {
              claimsAndScopeOverrideDetails: {
                accessTokenGeneration: {
                  claimsToAddOrOverride: { "custom:tenant": Item.defaultTenant },
                },
              },
            };
            return event;
          };
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  PreTokenGenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreTokenGenFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ==========================================================================
  # User pool
  # ==========================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${ApplicationId}-${Environment}"
      # ESSENTIALS is required for V3_0. See the header note.
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 1
          PasswordHistorySize: 5
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - Name: tenant
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints: { MinLength: "1", MaxLength: "64" }
      LambdaConfig:
        PreTokenGenerationConfig:
          # V3_0 is the only version that fires for client_credentials.
          # V2_0 covers human access tokens only; on V2_0 the machine path
          # receives no tenant claim and every M2M request is denied.
          LambdaVersion: V3_0
          LambdaArn: !GetAtt PreTokenGenFunction.Arn
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      UserPoolTags:
        costCenter: !Ref CostCenter
        environment: !Ref Environment
        applicationId: !Ref ApplicationId
        dataClassification: !Ref DataClassification
        owner: !Ref Owner

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${CognitoDomainPrefix}-${Environment}"
      UserPoolId: !Ref UserPool

  # ==========================================================================
  # Resource server
  #
  # Scopes exist here or client_credentials has nothing to request. The full
  # scope string the client asks for is "<identifier>/<scope>".
  # ==========================================================================
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: llm
      Name: !Sub "${ApplicationId} inference API"
      Scopes:
        - { ScopeName: invoke, ScopeDescription: Submit a prompt for inference }
        - { ScopeName: retrieve, ScopeDescription: Query the knowledge base }

  # ==========================================================================
  # API resource server — RFC 8707 resource binding target
  #
  # A second resource server whose identifier is the API URL rather than a bare
  # name. Resource binding requires the requested `resource` value to be a URL,
  # so `llm` above cannot serve as the binding target; this one can.
  #
  # Scopes are declared here as well because a token bound to this resource
  # carries scopes from the resource server it is bound to. Callers request
  # `<ApiResourceIdentifier>/invoke`, not `llm/invoke`, when using binding.
  # ==========================================================================
  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Ref ApiResourceIdentifier
      Name: !Sub "${ApplicationId} inference API (bound)"
      Scopes:
        - { ScopeName: invoke, ScopeDescription: Submit a prompt for inference }
        - { ScopeName: retrieve, ScopeDescription: Query the knowledge base }

  # ==========================================================================
  # Human app client - authorization code + PKCE, with RFC 8707 resource binding
  #
  # The client sends `resource=<ApiResourceIdentifier>` on the /oauth2/authorize
  # request. Cognito validates it is a URL and sets it as the access token's aud
  # claim; a refresh carries the same aud forward.
  #
  # Resource binding is available in authorization-code and implicit grants from
  # the Authorize endpoint only, on Managed Login, on Essentials or Plus. It is
  # NOT available for client_credentials — which is why the machine client below
  # is unchanged and the authorizer keeps two different client-binding rules.
  # ==========================================================================
  HumanClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: [ResourceServer, ApiResourceServer]
    Properties:
      ClientName: !Sub "${ApplicationId}-${Environment}-human"
      UserPoolId: !Ref UserPool
      # Public client: no secret. A browser cannot hold one, and shipping a
      # secret to a SPA is worse than having none - PKCE is the correct binding.
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      # Both scope sets are permitted. Bound requests use the URL-prefixed
      # scopes; unbound requests fall back to `llm/*`. The authorizer accepts
      # either and normalizes them (see the note in the Outputs section).
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - llm/invoke
        - llm/retrieve
        - !Sub "${ApiResourceIdentifier}/invoke"
        - !Sub "${ApiResourceIdentifier}/retrieve"
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      # SRP only. ALLOW_USER_PASSWORD_AUTH sends the password to the API in
      # plaintext-over-TLS and defeats the point of SRP.
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: !Ref AccessTokenMinutes
      IdTokenValidity: !Ref AccessTokenMinutes
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      # Rotation invalidates the prior refresh token on use, so a stolen one is
      # detectable: the legitimate client's next refresh fails.
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 30

  # ==========================================================================
  # Machine app client - client_credentials
  #
  # No callback URLs, no identity providers, no user context. sub on tokens from
  # this client is the app client ID, not a person - which is why rate limiting
  # and cost attribution key on the tenant claim rather than on sub.
  #
  # No resource binding. Cognito does not permit a resource indicator on a
  # client_credentials grant, so these tokens carry no aud claim at all and
  # client binding is client_id. That is not a configuration choice and cannot
  # be worked around at this layer - see the authorizer's two-path validation.
  # ==========================================================================
  MachineClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub "${ApplicationId}-${Environment}-machine"
      UserPoolId: !Ref UserPool
      # Confidential client: the secret IS the credential. It lives in the MCP
      # server's own secret store - Cognito issues it and never sees it again.
      GenerateSecret: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthFlowsUserPoolClient: true
      # Custom scopes only. openid/email/profile are user-context scopes and are
      # not issuable under client_credentials.
      AllowedOAuthScopes: [llm/invoke, llm/retrieve]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
      AccessTokenValidity: !Ref AccessTokenMinutes
      TokenValidityUnits:
        AccessToken: minutes

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub "${AWS::StackName}-UserPoolId" }
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: { Name: !Sub "${AWS::StackName}-UserPoolArn" }
  # The authorizer pins its JWKS fetch to this issuer. It must never derive the
  # issuer from the iss claim of a presented token.
  Issuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
    Export: { Name: !Sub "${AWS::StackName}-Issuer" }
  JwksUri:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
    Export: { Name: !Sub "${AWS::StackName}-JwksUri" }
  HumanClientId:
    Value: !Ref HumanClient
    Export: { Name: !Sub "${AWS::StackName}-HumanClientId" }
  MachineClientId:
    Value: !Ref MachineClient
    Export: { Name: !Sub "${AWS::StackName}-MachineClientId" }
  TokenEndpoint:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
    Export: { Name: !Sub "${AWS::StackName}-TokenEndpoint" }
  # The authorizer validates aud against this on the human path. Machine tokens
  # have no aud and are validated on client_id instead.
  ApiResourceIdentifier:
    Value: !Ref ApiResourceIdentifier
    Export: { Name: !Sub "${AWS::StackName}-ApiResourceIdentifier" }
  # Reference shape for the SPA. The `resource` parameter is what triggers the
  # aud binding; omitting it yields a token with no aud, which the authorizer
  # will reject on the human path.
  AuthorizeRequestExample:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize?response_type=code&client_id=${HumanClient}&resource=${ApiResourceIdentifier}&scope=openid+${ApiResourceIdentifier}/invoke&code_challenge_method=S256&code_challenge=<challenge>&redirect_uri=<callback>"
    Description: Human-path authorization request including the RFC 8707 resource parameter
