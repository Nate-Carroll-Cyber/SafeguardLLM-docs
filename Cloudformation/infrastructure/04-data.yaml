AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 04 - Aurora PostgreSQL Serverless v2 with pgvector, RDS Proxy, and the
  DynamoDB tables (ledger, budget, entitlement).

  RDS Proxy exists here because the compute tier is Lambda. Without pooling,
  concurrent invocations exhaust the cluster's connection limit long before they
  exhaust its compute.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  DataClassification:
    Type: String
    Default: confidential
  KmsStackName:
    Type: String
  NetworkStackName:
    Type: String
  MinCapacityAcu:
    Type: Number
    Default: 0.5
    MinValue: 0
    MaxValue: 128
    Description: >
      Serverless v2 floor. 0.5 is the minimum billable capacity; 0 permits
      scale-to-zero with a cold-start penalty on the first connection after
      idle. Drives cost more than any other parameter in this stack.
  MaxCapacityAcu:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 128
  EngineVersion:
    Type: String
    Default: "16.6"
    Description: Aurora PostgreSQL version. pgvector requires 15.3+ / 16.x.
  BackupRetentionDays:
    Type: Number
    Default: 35
    MinValue: 1
    MaxValue: 35
    Description: 35 is the PITR ceiling. Longer retention comes from AWS Backup.
  LedgerContentTtlDays:
    Type: Number
    Default: 30
  JobTtlHours:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 24
    Description: >
      How long a completed job payload survives. Long enough for exponential
      backoff polling and a network reconnect; short enough that raw model
      output does not outlive a user session.
  DeletionProtectionEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:

  # ==========================================================================
  # Aurora PostgreSQL Serverless v2
  # ==========================================================================

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ApplicationId} isolated data subnets"
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-DataSubnetIds" }]
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # The master credential exists to bootstrap the cluster and to back the proxy.
  # Application access uses rds-db:connect against an IAM-mapped database role,
  # so this secret is never read by the adapter.
  MasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ApplicationId}/${Environment}/db-master"
      Description: Aurora master credential - bootstrap and proxy only
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-SecretsKeyArn" }
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${ApplicationId}_master"}'
        GenerateStringKey: password
        PasswordLength: 40
        # Postgres rejects these in a connection URI without escaping, and the
        # proxy builds a URI internally.
        ExcludeCharacters: '"@/\''`'
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  DbClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: !Sub "${ApplicationId} ${Environment} cluster parameters"
      Family: aurora-postgresql16
      Parameters:
        # Reject any non-TLS connection at the engine. The client sets
        # rejectUnauthorized, but a client can be changed; this cannot be
        # bypassed from the application side.
        rds.force_ssl: "1"
        # pgvector and pg_cron must be preloaded before CREATE EXTENSION works.
        # pg_cron drives the monthly partition drop in spec section 12.3.
        shared_preload_libraries: "pg_stat_statements,pg_cron"
        # Statements are logged with parameters stripped. Vector literals and
        # prompt-derived values would otherwise land in the Postgres log.
        log_statement: "ddl"
        log_min_duration_statement: "1000"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub "${ApplicationId}-${Environment}"
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Sub "${ApplicationId}_db"
      MasterUsername: !Sub "{{resolve:secretsmanager:${MasterSecret}::username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${MasterSecret}::password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBClusterParameterGroupName: !Ref DbClusterParameterGroup
      VpcSecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-DatabaseSecurityGroupId" }
      StorageEncrypted: true
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-RdsKeyArn" }
      # Required for rds-db:connect. Without it the IAM policy in layer 03 is
      # inert and the adapter falls back to nothing - there is no password path.
      EnableIAMDatabaseAuthentication: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: "07:00-08:00"
      PreferredMaintenanceWindow: "sun:08:30-sun:09:30"
      DeletionProtection: !Ref DeletionProtectionEnabled
      CopyTagsToSnapshot: true
      # Postgres logs to CloudWatch; the log group is created by RDS, so its
      # retention and encryption are set in layer 10 rather than here.
      EnableCloudwatchLogsExports: [postgresql]
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacityAcu
        MaxCapacity: !Ref MaxCapacityAcu
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DbInstanceA:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ApplicationId}-${Environment}-a"
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-RdsKeyArn" }
      PerformanceInsightsRetentionPeriod: 7
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # Second instance in prod only. A single-instance Serverless v2 cluster has no
  # failover target - the AZ redundancy in the subnet layout buys nothing without it.
  DbInstanceB:
    Type: AWS::RDS::DBInstance
    Condition: IsProd
    Properties:
      DBInstanceIdentifier: !Sub "${ApplicationId}-${Environment}-b"
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-RdsKeyArn" }
      PerformanceInsightsRetentionPeriod: 7
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # RDS Proxy
  # ==========================================================================

  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-RdsProxyRole"
      Description: RDS Proxy credential retrieval
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: rds.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: proxy-secret-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMasterSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref MasterSecret
              - Sid: DecryptSecret
                Effect: Allow
                Action: kms:Decrypt
                Resource: { "Fn::ImportValue": !Sub "${KmsStackName}-SecretsKeyArn" }
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DbProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "${ApplicationId}-${Environment}-proxy"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt ProxyRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref MasterSecret
          # REQUIRED forces the client to present an IAM auth token. The proxy
          # then uses the master secret for its own connection to the cluster.
          # This is what lets the adapter hold no password at all.
          IAMAuth: REQUIRED
          ClientPasswordAuthType: POSTGRES_SCRAM_SHA_256
      RequireTLS: true
      IdleClientTimeout: 1800
      DebugLogging: false
      VpcSubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-DataSubnetIds" }]
      VpcSecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-DatabaseSecurityGroupId" }
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DbProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref DbProxy
      TargetGroupName: default
      DBClusterIdentifiers: [!Ref DbCluster]
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 5
        # Pinning defeats pooling. These statements are safe to reuse across
        # sessions; anything setting session state would pin the connection and
        # silently reduce the pool to one connection per invocation.
        SessionPinningFilters: [EXCLUDE_VARIABLE_SETS]

  # ==========================================================================
  # DynamoDB
  # ==========================================================================

  # --- Ledger. pk is TENANT#<id>, which is what dynamodb:LeadingKeys binds
  #     against in layer 03. Changing the key shape disables that condition
  #     without any error - the policy still evaluates, it just stops scoping.
  LedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ApplicationId}-${Environment}-ledger"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      # TTL deletion is asynchronous - items typically clear within 48 hours of
      # expiry and remain readable until then. The adapter filters at read time
      # so behaviour matches policy. This is not a compliance-grade deletion
      # guarantee and should not be described as one.
      TimeToLiveSpecification:
        AttributeName: contentTtl
        Enabled: true
      # Streams carry the expiry deletions that produce erasure receipts.
      StreamSpecification:
        StreamViewType: OLD_IMAGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-AppDataKeyArn" }
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }
        - { Key: contentTtlDays, Value: !Ref LedgerContentTtlDays }

  # --- Budget counters. Tier 1 of the three-tier circuit breaker. Two key
  #     prefixes: TENANT# and CLIENT#, so a caller entitled to several tenants
  #     cannot multiply its budget by rotating the tenant it asserts.
  BudgetTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ApplicationId}-${Environment}-budget"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-AppDataKeyArn" }
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: internal }
        - { Key: owner, Value: !Ref Owner }

  # --- Entitlement. clientId -> {defaultTenant, allowedTenants}.
  #     This table is the authoritative answer to "may this client act for this
  #     tenant". Every tenant boundary in the system resolves back to a row here,
  #     which makes it the highest-integrity data in the workload account: the
  #     authorizer role has GetItem and an explicit Deny on every write.
  #     No TTL. Nothing here expires.
  EntitlementTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ApplicationId}-${Environment}-entitlement"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: clientId, AttributeType: S }
      KeySchema:
        - { AttributeName: clientId, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-AppDataKeyArn" }
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # --- Revocation denylist. Two key shapes:
  #       JTI#<origin_jti>  one token family
  #       SUB#<sub>         every token for a caller
  #
  #     JWTs are stateless, so a valid signature says nothing about whether the
  #     token was revoked after issuance. Cognito's RevokeToken invalidates
  #     tokens sharing an origin_jti, and offline verification cannot see that.
  #     This table is how the authorizer sees it.
  #
  #     TTL matches the token's own expiry, so a row disappears exactly when
  #     checking it stops mattering. Written by RevokeToken handling and by the
  #     containment runbook; read by the authorizer, which has no write path.
  RevocationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ApplicationId}-${Environment}-revocation"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-AppDataKeyArn" }
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # --- Async job table.
  #
  #     pk = TENANT#<id> is the whole security design in one line: the existing
  #     dynamodb:LeadingKeys condition transfers unchanged, so a caller polling
  #     another tenant's job ID is denied at IAM before the application sees the
  #     request. A guessable job ID stops mattering.
  #
  #     Expire on TTL, never delete-on-read. If the client drops the connection
  #     before parsing the payload, delete-on-read loses a response the caller
  #     has already been billed for.
  #
  #     Own CMK. This table holds raw model output - the content category the
  #     ledger deliberately excludes.
  JobTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ApplicationId}-${Environment}-jobs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-VolatileKeyArn" }
      # No PITR. A two-hour content store does not want a 35-day continuous
      # backup of raw model output sitting behind it.
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }
        - { Key: jobTtlHours, Value: !Ref JobTtlHours }

Outputs:
  ClusterEndpoint:
    Value: !GetAtt DbCluster.Endpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-ClusterEndpoint" }
  ProxyEndpoint:
    Value: !GetAtt DbProxy.Endpoint
    Export: { Name: !Sub "${AWS::StackName}-ProxyEndpoint" }
  ProxyArn:
    Value: !GetAtt DbProxy.DBProxyArn
    Export: { Name: !Sub "${AWS::StackName}-ProxyArn" }
  DatabaseName:
    Value: !Sub "${ApplicationId}_db"
    Export: { Name: !Sub "${AWS::StackName}-DatabaseName" }
  MasterSecretArn:
    Value: !Ref MasterSecret
    Export: { Name: !Sub "${AWS::StackName}-MasterSecretArn" }
  LedgerTableName:
    Value: !Ref LedgerTable
    Export: { Name: !Sub "${AWS::StackName}-LedgerTableName" }
  LedgerStreamArn:
    Value: !GetAtt LedgerTable.StreamArn
    Export: { Name: !Sub "${AWS::StackName}-LedgerStreamArn" }
  BudgetTableName:
    Value: !Ref BudgetTable
    Export: { Name: !Sub "${AWS::StackName}-BudgetTableName" }
  EntitlementTableName:
    Value: !Ref EntitlementTable
    Export: { Name: !Sub "${AWS::StackName}-EntitlementTableName" }
  RevocationTableName:
    Value: !Ref RevocationTable
    Export: { Name: !Sub "${AWS::StackName}-RevocationTableName" }
  JobTableName:
    Value: !Ref JobTable
    Export: { Name: !Sub "${AWS::StackName}-JobTableName" }
  JobTtlHours:
    Value: !Ref JobTtlHours
    Export: { Name: !Sub "${AWS::StackName}-JobTtlHours" }
