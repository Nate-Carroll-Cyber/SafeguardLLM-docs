AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 02 - VPC endpoints (spec section 5.2).

  These are not connectivity: every call here would succeed over NAT. They exist
  so that aws:SourceVpce becomes available as a condition key, so endpoint
  policies provide a second authorization evaluation independent of identity
  policy, and so payloads stay off an internet path.

  Once the compute tier has no default route they become load-bearing. A missing
  endpoint is a hard failure with no NAT fallback - notably cognito-idp, without
  which a VPC-attached authorizer cannot fetch the JWKS and fails at cold start.

  Endpoint policies reference role ARNs by deterministic name rather than by
  import, because layer 03 needs endpoint IDs from this stack. Naming breaks the
  cycle; the names here and in 03-identity must stay in sync.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  NetworkStackName:
    Type: String
    Description: Stack name of 01-network
  ApprovedInferenceProfileArns:
    Type: CommaDelimitedList
    Description: Application inference profile ARNs the workload may invoke
  GuardrailArn:
    Type: String
    Description: Bedrock guardrail ARN, used in the endpoint policy condition
  KnowledgeBaseArn:
    Type: String
    Description: Bedrock knowledge base ARN for the Retrieve action

Resources:

  # ==========================================================================
  # Gateway endpoints - route table entries, no ENI, no hourly charge
  # ==========================================================================
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeRouteTableId" }
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-DataRouteTableId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Organization-scoped. A role induced to write to an attacker's bucket
          # fails here even when the identity policy would allow the action.
          - Sid: OrgResourcesOnly
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceOrgID: "${aws:PrincipalOrgID}"
          # Lambda pulls its deployment package from a service-owned bucket.
          # Omitting this breaks every function in the isolated tier.
          - Sid: AllowLambdaArtifacts
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::prod-${AWS::Region}-starport-layer-bucket/*"

  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeRouteTableId" }
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-DataRouteTableId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkloadTablesOnly
            Effect: Allow
            Principal: "*"
            Action:
              # dynamodb:TransactWriteItems is NOT an IAM action. The
              # TransactWriteItems API authorizes on the item-level action for
              # each operation in the transaction, plus ConditionCheckItem for
              # any condition check. Listing the non-action here while omitting
              # ConditionCheckItem denies a transaction at the endpoint that the
              # identity policy allows - the two policies must enumerate the
              # same real actions.
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationId}-${Environment}-*"

  # ==========================================================================
  # Interface endpoints
  # ==========================================================================

  # --- Bedrock runtime: the one that matters most.
  #     Restricts principal, inference profile, and guardrail independently of
  #     the identity policy. Both must be wrong before an unguarded call lands.
  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GuardedInferenceOnly
            Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-SafeguardExecRole"
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: !Ref ApprovedInferenceProfileArns
            Condition:
              StringEquals:
                bedrock:GuardrailIdentifier: !Ref GuardrailArn
          # ApplyGuardrail carries no GuardrailIdentifier condition - it names the
          # guardrail in the request body, so the resource ARN is the control.
          - Sid: AllowApplyGuardrail
            Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-SafeguardExecRole"
                - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-EgressProxyRole"
            Action: bedrock:ApplyGuardrail
            Resource: !Ref GuardrailArn

  BedrockAgentRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-agent-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Retrieve only. RetrieveAndGenerate is absent deliberately: it issues
          # an implicit model invocation that carries no guardrail identifier,
          # which both defeats the enforcement condition and would be denied by it.
          - Sid: RetrieveOnly
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-KBRetrieveRole"
            Action: bedrock:Retrieve
            Resource: !Ref KnowledgeBaseArn

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkloadSecretsOnly
            Effect: Allow
            Principal: "*"
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecretVersionStage
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApplicationId}/${Environment}/*"

  KmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountKeysOnly
            Effect: Allow
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The SafeguardExecRole -> KBRetrieveRole hop resolves here.
          - Sid: InAccountAssumeOnly
            Effect: Allow
            Principal: "*"
            Action:
              - sts:AssumeRole
              - sts:GetCallerIdentity
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ApplicationId}-${Environment}-*"

  # --- cognito-idp: required for JWKS retrieval by a VPC-attached authorizer.
  #     Omitting this is the failure that looks like a broken deployment rather
  #     than a missing endpoint - cold start hangs, every request 500s.
  #
  #     DELIBERATELY has no endpoint policy, unlike every other interface endpoint
  #     here. The authorizer's only use of this service is fetching the pool JWKS
  #     (.well-known/jwks.json), which aws-jwt-verify does as an ANONYMOUS,
  #     unsigned GET. An anonymous request carries no principal, so any statement
  #     conditioned on aws:PrincipalAccount / aws:PrincipalOrgID - or any Principal
  #     narrowing - denies it, and a policy whose only Allow is authenticated
  #     produces an implicit deny for the anonymous fetch. Either reproduces the
  #     silent cold-start failure above. A resource-only Allow is not reliably
  #     safe either: the JWKS retrieval does not map cleanly to a resource-scoped
  #     IAM action.
  #
  #     The residual risk the account/org backstop would cover - a compromised
  #     compute-tier role using cognito-idp:* to enumerate or mutate another
  #     account's user pool - is instead closed at the identity-policy layer:
  #     no role in this tier is granted any cognito-idp management action (layer
  #     03), and the authorizer needs none for an anonymous JWKS GET. If a future
  #     role is granted cognito-idp actions, revisit this: scope THAT role's
  #     identity policy to the workload pool ARN rather than reopening the risk
  #     here, since this endpoint cannot express the distinction without breaking
  #     JWKS. Verify any change with an authorizer cold-start smoke test.
  CognitoIdpEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.cognito-idp"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }

  # All traffic here is SigV4-signed by the compute-tier execution roles, so a
  # principal/account condition is safe (unlike cognito-idp below). aws:PrincipalAccount
  # pinned to this account is the data-perimeter backstop: a role induced to write
  # to a cross-account log group is denied here even when its identity policy allows
  # logs:* - CloudWatch Logs is the one exfil channel that IS resource-addressable
  # cross-account, which is why this endpoint matters most of the three.
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InAccountLogsOnly
            Effect: Allow
            Principal: "*"
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:PutRetentionPolicy
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  # PutMetricData does not support resource-level scoping (Resource must be "*"),
  # so the perimeter is enforced on the principal's account instead.
  MonitoringEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InAccountMetricsOnly
            Effect: Allow
            Principal: "*"
            Action:
              - cloudwatch:PutMetricData
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  # X-Ray write/sampling actions do not support resource-level scoping either;
  # same principal-account perimeter.
  XRayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.xray"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-EndpointSecurityGroupId" }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InAccountTracingOnly
            Effect: Allow
            Principal: "*"
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:GetSamplingStatisticSummaries
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  # --- The egress proxy needs ApplyGuardrail and Secrets Manager from its own
  #     subnet. Its ENIs are in the egress tier, so the endpoints above (compute
  #     tier) are reachable only because private DNS resolves VPC-wide and the
  #     egress tier has a local route. Confirm before relying on it: if the
  #     egress subnets are ever moved to a separate VPC, these need duplicating.

Outputs:
  BedrockRuntimeEndpointId:
    Value: !Ref BedrockRuntimeEndpoint
    Export: { Name: !Sub "${AWS::StackName}-BedrockRuntimeEndpointId" }
  BedrockAgentRuntimeEndpointId:
    Value: !Ref BedrockAgentRuntimeEndpoint
    Export: { Name: !Sub "${AWS::StackName}-BedrockAgentRuntimeEndpointId" }
  SecretsManagerEndpointId:
    Value: !Ref SecretsManagerEndpoint
    Export: { Name: !Sub "${AWS::StackName}-SecretsManagerEndpointId" }
  KmsEndpointId:
    Value: !Ref KmsEndpoint
    Export: { Name: !Sub "${AWS::StackName}-KmsEndpointId" }
  StsEndpointId:
    Value: !Ref StsEndpoint
    Export: { Name: !Sub "${AWS::StackName}-StsEndpointId" }
  S3GatewayEndpointId:
    Value: !Ref S3GatewayEndpoint
    Export: { Name: !Sub "${AWS::StackName}-S3GatewayEndpointId" }
  DynamoDbGatewayEndpointId:
    Value: !Ref DynamoDbGatewayEndpoint
    Export: { Name: !Sub "${AWS::StackName}-DynamoDbGatewayEndpointId" }
  # Convenience list for aws:SourceVpce conditions in layer 03.
  DataPerimeterEndpointIds:
    Value: !Join
      - ","
      - - !Ref S3GatewayEndpoint
        - !Ref DynamoDbGatewayEndpoint
        - !Ref BedrockRuntimeEndpoint
        - !Ref BedrockAgentRuntimeEndpoint
        - !Ref SecretsManagerEndpoint
        - !Ref KmsEndpoint
        - !Ref StsEndpoint
    Export: { Name: !Sub "${AWS::StackName}-DataPerimeterEndpointIds" }
