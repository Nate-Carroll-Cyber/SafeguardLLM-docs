AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 01 - VPC, subnets, routing, NAT, and Network Firewall egress inspection.

  Five subnet tiers per AZ, not the four in spec section 5.1. Network Firewall
  requires a dedicated subnet with no other resources in it, so the firewall
  endpoints cannot share the public tier. Spec section 5.1 should be amended.

  Traffic order on egress is firewall-then-NAT, so the firewall sees real source
  IPs rather than the NAT address. Reversing it makes per-source rules useless.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  DataClassification:
    Type: String
    Default: confidential
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-4])$"
  LogsKeyArn:
    Type: String
    Description: cmk/logs ARN from the 00-kms stack
  AllowedEgressDomains:
    Type: CommaDelimitedList
    Description: >
      FQDNs the egress proxy may reach. Judge API and package registries only.
      Wildcards use a leading dot, e.g. .registry.npmjs.org
    Default: ".registry.npmjs.org,.pypi.org"
  FlowLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 90, 180, 365, 400]

Mappings:
  SubnetOffsets:
    Public:    { A: 0,  B: 1 }
    Firewall:  { A: 2,  B: 3 }
    Egress:    { A: 4,  B: 5 }
    Compute:   { A: 6,  B: 7 }
    Data:      { A: 8,  B: 9 }

Resources:

  # ==========================================================================
  # VPC
  # ==========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      # Required for interface endpoint private DNS. Without it the SDK resolves
      # the public service endpoint and every "isolated" call leaves the VPC.
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-igw" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ==========================================================================
  # Subnets - /20 blocks carved from the VPC CIDR
  # ==========================================================================
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Public, A], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-public-a" }
        - { Key: tier, Value: public }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Public, B], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-public-b" }
        - { Key: tier, Value: public }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  FirewallSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Firewall, A], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-fw-a" }
        - { Key: tier, Value: firewall }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  FirewallSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Firewall, B], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-fw-b" }
        - { Key: tier, Value: firewall }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EgressSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Egress, A], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-egress-a" }
        - { Key: tier, Value: private-egress }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EgressSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Egress, B], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-egress-b" }
        - { Key: tier, Value: private-egress }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  ComputeSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Compute, A], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-compute-a" }
        - { Key: tier, Value: isolated-compute }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  ComputeSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Compute, B], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-compute-b" }
        - { Key: tier, Value: isolated-compute }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Data, A], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-data-a" }
        - { Key: tier, Value: isolated-data }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [SubnetOffsets, Data, B], !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-data-b" }
        - { Key: tier, Value: isolated-data }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Network Firewall
  #
  # Created before the route tables that point at it, because the endpoint IDs
  # come out of EndpointIds and are needed as route targets.
  # ==========================================================================
  FirewallRuleGroupDomainAllow:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ApplicationId}-${Environment}-fqdn-allow"
      Type: STATEFUL
      Capacity: 200
      RuleGroup:
        RulesSource:
          RulesSourceList:
            # TLS_SNI inspects the SNI field of the ClientHello. Metadata only -
            # this control governs destination, never payload. HTTP_HOST covers
            # the plaintext case, which should not occur but is cheap to include.
            GeneratedRulesType: ALLOWLIST
            TargetTypes: [TLS_SNI, HTTP_HOST]
            Targets: !Ref AllowedEgressDomains
        StatefulRuleOptions:
          # Strict order means rules evaluate top-down and the default action
          # below applies. Without it, the default is to pass unmatched traffic.
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  FirewallPolicy:
    Type: AWS::NetworkFirewall::FirewallPolicy
    Properties:
      FirewallPolicyName: !Sub "${ApplicationId}-${Environment}-policy"
      FirewallPolicy:
        StatelessDefaultActions: [aws:forward_to_sfe]
        StatelessFragmentDefaultActions: [aws:forward_to_sfe]
        # Deny by default. Anything the allow-list does not name is dropped and
        # alerted, which is the whole point of a single egress chokepoint.
        StatefulDefaultActions:
          - aws:drop_established
          - aws:alert_established
        StatefulEngineOptions:
          RuleOrder: STRICT_ORDER
        StatefulRuleGroupReferences:
          - ResourceArn: !GetAtt FirewallRuleGroupDomainAllow.RuleGroupArn
            Priority: 100
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  Firewall:
    Type: AWS::NetworkFirewall::Firewall
    Properties:
      FirewallName: !Sub "${ApplicationId}-${Environment}-fw"
      FirewallPolicyArn: !Ref FirewallPolicy
      VpcId: !Ref Vpc
      SubnetMappings:
        - SubnetId: !Ref FirewallSubnetA
        - SubnetId: !Ref FirewallSubnetB
      DeleteProtection: true
      FirewallPolicyChangeProtection: true
      SubnetChangeProtection: true
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  FirewallAlertLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/network-firewall/${ApplicationId}-${Environment}/alert"
      RetentionInDays: !Ref FlowLogRetentionDays
      KmsKeyId: !Ref LogsKeyArn

  FirewallFlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/network-firewall/${ApplicationId}-${Environment}/flow"
      RetentionInDays: !Ref FlowLogRetentionDays
      KmsKeyId: !Ref LogsKeyArn

  FirewallLoggingConfiguration:
    Type: AWS::NetworkFirewall::LoggingConfiguration
    Properties:
      FirewallArn: !Ref Firewall
      LoggingConfiguration:
        LogDestinationConfigs:
          - LogType: ALERT
            LogDestinationType: CloudWatchLogs
            LogDestination:
              logGroup: !Ref FirewallAlertLogGroup
          - LogType: FLOW
            LogDestinationType: CloudWatchLogs
            LogDestination:
              logGroup: !Ref FirewallFlowLogGroup

  # ==========================================================================
  # NAT
  # ==========================================================================
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-nat-a" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  NatEipB:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-nat-b" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-nat-a" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-nat-b" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Route tables
  #
  # Egress path: egress subnet -> firewall endpoint -> NAT -> IGW
  # The firewall sits ahead of NAT so it observes real source addresses.
  # ==========================================================================

  # --- Public: NAT lives here, exits via IGW
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-public" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # --- Firewall subnets: forward inspected traffic to NAT in the same AZ
  FirewallRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-fw-a" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  FirewallRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref FirewallRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  FirewallSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref FirewallSubnetA, RouteTableId: !Ref FirewallRouteTableA }

  FirewallRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-fw-b" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  FirewallRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref FirewallRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  FirewallSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref FirewallSubnetB, RouteTableId: !Ref FirewallRouteTableB }

  # --- Egress proxy subnets: default route into the firewall endpoint
  EgressRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-egress-a" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # Firewall.EndpointIds returns entries shaped "az:vpce-id". Select the AZ that
  # matches this route table and split off the endpoint ID.
  EgressRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref EgressRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      VpcEndpointId: !Select [1, !Split [":", !Select [0, !GetAtt Firewall.EndpointIds]]]

  EgressSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref EgressSubnetA, RouteTableId: !Ref EgressRouteTableA }

  EgressRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-egress-b" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EgressRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref EgressRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      VpcEndpointId: !Select [1, !Split [":", !Select [1, !GetAtt Firewall.EndpointIds]]]

  EgressSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref EgressSubnetB, RouteTableId: !Ref EgressRouteTableB }

  # --- Isolated compute: local plus gateway endpoints. No default route.
  #     This is the control. A security group misconfiguration cannot create
  #     internet access that the route table does not provide.
  ComputeRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-compute" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  ComputeSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref ComputeSubnetA, RouteTableId: !Ref ComputeRouteTable }
  ComputeSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref ComputeSubnetB, RouteTableId: !Ref ComputeRouteTable }

  # --- Isolated data: local only
  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-rt-data" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DataSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetA, RouteTableId: !Ref DataRouteTable }
  DataSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetB, RouteTableId: !Ref DataRouteTable }

  # ==========================================================================
  # Security groups
  # ==========================================================================
  AdapterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Express adapter and authorizer Lambda ENIs
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to interface endpoints and gateway-endpoint services
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
        - Description: PostgreSQL to RDS Proxy
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-sg-adapter" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EgressProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress proxy Lambda - the only function permitted outbound
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to third-party inference via firewall and NAT
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-sg-egress-proxy" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface endpoint ENIs
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: No egress required from endpoint ENIs
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-sg-endpoints" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EndpointIngressFromAdapter:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      Description: HTTPS from adapter and authorizer
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref AdapterSecurityGroup

  EndpointIngressFromEgressProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      Description: HTTPS from egress proxy for ApplyGuardrail and Secrets Manager
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EgressProxySecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora cluster and RDS Proxy
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: No egress required
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationId}-${Environment}-sg-db" }
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  DatabaseIngressFromAdapter:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL from adapter
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AdapterSecurityGroup

  DatabaseIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      Description: RDS Proxy to cluster
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DatabaseSecurityGroup

  # ==========================================================================
  # VPC Flow Logs
  # ==========================================================================
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*"
      Policies:
        - PolicyName: flow-log-delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/vpc/flowlogs/${ApplicationId}-${Environment}"
      RetentionInDays: !Ref FlowLogRetentionDays
      KmsKeyId: !Ref LogsKeyArn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "${AWS::StackName}-VpcCidr" }
  ComputeSubnetIds:
    Value: !Join [",", [!Ref ComputeSubnetA, !Ref ComputeSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-ComputeSubnetIds" }
  DataSubnetIds:
    Value: !Join [",", [!Ref DataSubnetA, !Ref DataSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-DataSubnetIds" }
  EgressSubnetIds:
    Value: !Join [",", [!Ref EgressSubnetA, !Ref EgressSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-EgressSubnetIds" }
  ComputeRouteTableId:
    Value: !Ref ComputeRouteTable
    Export: { Name: !Sub "${AWS::StackName}-ComputeRouteTableId" }
  DataRouteTableId:
    Value: !Ref DataRouteTable
    Export: { Name: !Sub "${AWS::StackName}-DataRouteTableId" }
  EgressRouteTableIds:
    Value: !Join [",", [!Ref EgressRouteTableA, !Ref EgressRouteTableB]]
    Export: { Name: !Sub "${AWS::StackName}-EgressRouteTableIds" }
  AdapterSecurityGroupId:
    Value: !Ref AdapterSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-AdapterSecurityGroupId" }
  EgressProxySecurityGroupId:
    Value: !Ref EgressProxySecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-EgressProxySecurityGroupId" }
  EndpointSecurityGroupId:
    Value: !Ref EndpointSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-EndpointSecurityGroupId" }
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-DatabaseSecurityGroupId" }
