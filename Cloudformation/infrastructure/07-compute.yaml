AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 07 - Lambda functions: authorizer, Express adapter, egress proxy,
  secrets rotation, and lifecycle.

  Code is deployed from an S3 artifact bucket, not inline. ZipFile inline code is
  capped at 4096 bytes and cannot carry node_modules, so any function with an SDK
  dependency needs a packaged artifact.

  Every function declares its own log group rather than letting Lambda create one
  on first invoke. An auto-created group has no KMS key and no retention - it
  inherits nothing, and by the time you notice it already holds data.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  DataClassification:
    Type: String
    Default: confidential
  KmsStackName:
    Type: String
  NetworkStackName:
    Type: String
  IdentityStackName:
    Type: String
  DataStackName:
    Type: String
  CognitoStackName:
    Type: String
  BedrockStackName:
    Type: String
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding packaged function artifacts
  ArtifactVersion:
    Type: String
    Description: Object key prefix, typically the commit SHA
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Exact origins for CORS. No wildcards.
  JudgeApiUrl:
    Type: String
    Description: Third-party inference endpoint reached via the egress proxy
  KbRetrieveExternalId:
    Type: String
    NoEcho: true
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 90, 180, 365, 400]
  RequireClientCertForMachine:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Viewer mTLS enforcement for machine callers. Leave false until the
      CloudFront trust store is live AND every machine client has a
      certThumbprint provisioned in the entitlement table - the authorizer
      denies a machine caller whose row lacks one.
  TenantTokenBudget:
    Type: Number
    Default: 1000000
    Description: Tier-1 daily token ceiling per tenant and per client
  AdapterReservedConcurrency:
    Type: Number
    Default: 50
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: >
      Used by the worker for the adversarial-similarity check. Must match the
      dimension of the pgvector column in sql/01-bootstrap.sql - a mismatch
      fails at query time, not at deploy time.
  MaxCompletionTokens:
    Type: Number
    Default: 2048
    MinValue: 256
    MaxValue: 8192
    Description: >
      Read by BOTH functions and they must agree. The submit path reserves
      prompt tokens plus this value; the worker passes it as
      inferenceConfig.maxTokens. Divergence under-reserves or over-charges, and
      neither shows up as an error.
  WorkerReservedConcurrency:
    Type: Number
    Default: 20
    Description: >
      The real backpressure control now. The submit path is cheap and fast, so
      concurrency there bounds little; this is what bounds how much inference
      can be in flight at once.
  EgressProxyReservedConcurrency:
    Type: Number
    Default: 10
    Description: >
      Set below the ApplyGuardrail throughput limit. This converts a guardrail
      throttle - which would otherwise be a fail-open pressure point - into a
      queueing delay upstream.

Resources:

  # ==========================================================================
  # Log groups
  # ==========================================================================
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-authorizer"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-worker"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  AdapterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-adapter"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  EgressProxyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-egress-proxy"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  SecretsRotationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-secrets-rotation"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  LifecycleLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationId}-${Environment}-lifecycle"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  # ==========================================================================
  # Authorizer
  #
  # VPC-attached so its entitlement lookup carries aws:SourceVpce. That costs an
  # ENI attach at cold start, in the hot path of every uncached request. The
  # alternative - running it outside the VPC - is faster and leaves the one
  # identity-critical DynamoDB call outside the data perimeter. In-VPC chosen;
  # the cognito-idp endpoint in layer 02 exists for this function's JWKS fetch.
  # ==========================================================================
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthorizerLogGroup
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-authorizer"
      Runtime: nodejs24.x
      Handler: index.handler
      Role: { "Fn::ImportValue": !Sub "${IdentityStackName}-AuthorizerRoleArn" }
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "${ArtifactVersion}/authorizer.zip"
      # Short. An authorizer that takes seconds is an availability problem, and
      # every check it performs is either local or a single-item DynamoDB read.
      Timeout: 5
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
        SecurityGroupIds:
          - { "Fn::ImportValue": !Sub "${NetworkStackName}-AdapterSecurityGroupId" }
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: { "Fn::ImportValue": !Sub "${CognitoStackName}-UserPoolId" }
          COGNITO_HUMAN_CLIENT_IDS: { "Fn::ImportValue": !Sub "${CognitoStackName}-HumanClientId" }
          COGNITO_MACHINE_CLIENT_IDS: { "Fn::ImportValue": !Sub "${CognitoStackName}-MachineClientId" }
          CLIENT_TENANT_ENTITLEMENT_TABLE:
            { "Fn::ImportValue": !Sub "${DataStackName}-EntitlementTableName" }
          TOKEN_REVOCATION_TABLE:
            { "Fn::ImportValue": !Sub "${DataStackName}-RevocationTableName" }
          API_RESOURCE_IDENTIFIER:
            { "Fn::ImportValue": !Sub "${CognitoStackName}-ApiResourceIdentifier" }
          # Set true once the trust store exists and consuming clients are
          # enrolled with a certThumbprint in the entitlement table. Turning it
          # on before enrolment denies every machine caller - the check fails
          # closed on a missing thumbprint by design.
          REQUIRE_CLIENT_CERT_FOR_MACHINE: !Ref RequireClientCertForMachine
          CLOCK_SKEW_SECONDS: "30"
          NODE_OPTIONS: "--enable-source-maps"
      TracingConfig:
        Mode: Active
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Express adapter
  # ==========================================================================
  AdapterFunction:
    Type: AWS::Lambda::Function
    DependsOn: AdapterLogGroup
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-adapter"
      Runtime: nodejs24.x
      Handler: handler.handler
      Role: { "Fn::ImportValue": !Sub "${IdentityStackName}-SubmitAdapterRoleArn" }
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "${ArtifactVersion}/adapter.zip"
      # 10 s, not 28. The submit path authorizes, reserves budget, writes a
      # QUEUED job, and async-invokes the worker - nothing on it can legitimately
      # take longer.
      #
      # The short timeout is also a control. lambda:InvocationType is not an IAM
      # condition key, so nothing at the policy layer stops this function calling
      # the worker synchronously; a 10 s ceiling means such a call fails rather
      # than blocking, and the 29 s API Gateway ceiling stops being a constraint
      # anyone has to negotiate with.
      Timeout: 10
      MemorySize: 512
      ReservedConcurrentExecutions: !Ref AdapterReservedConcurrency
      VpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
        SecurityGroupIds:
          - { "Fn::ImportValue": !Sub "${NetworkStackName}-AdapterSecurityGroupId" }
      Environment:
        # No secrets here. Environment variables are readable by anyone holding
        # lambda:GetFunctionConfiguration - names and endpoints only.
        Variables:
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          MAX_BODY_BYTES: "32768"
          JOB_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-JobTableName" }
          JOB_TTL_HOURS: { "Fn::ImportValue": !Sub "${DataStackName}-JobTtlHours" }
          BUDGET_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-BudgetTableName" }
          TENANT_TOKEN_BUDGET: !Ref TenantTokenBudget
          # Upper bound charged at submit: prompt tokens plus max completion.
          # Reconciled by the worker, which caps generation at the same value.
          MAX_COMPLETION_TOKENS: !Ref MaxCompletionTokens
          WORKER_FUNCTION: !Sub "${ApplicationId}-${Environment}-worker"
          NODE_OPTIONS: "--enable-source-maps"
      TracingConfig:
        Mode: Active
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Worker
  #
  # Everything that used to run inside the 29 s API Gateway ceiling: judge,
  # retrieval, guardrail, Converse, ledger. Invoked asynchronously, so the
  # ceiling is Lambda's 15 minutes rather than API Gateway's 29 seconds.
  #
  # Async invoke is at-least-once. The worker's first action is a conditional
  # UpdateItem moving QUEUED to PROCESSING; if that condition fails another
  # worker already has the job, and this one exits immediately having done
  # nothing. Without that lock a retry double-writes the ledger and
  # double-charges the budget.
  # ==========================================================================
  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-worker"
      Runtime: nodejs24.x
      Handler: index.handler
      Role: { "Fn::ImportValue": !Sub "${IdentityStackName}-SafeguardExecRoleArn" }
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "${ArtifactVersion}/worker.zip"
      # 5 minutes. Generous against generation latency and far short of the
      # 15-minute ceiling, so a hung job fails rather than occupying a
      # concurrency slot for a quarter hour.
      Timeout: 300
      MemorySize: 1769
      ReservedConcurrentExecutions: !Ref WorkerReservedConcurrency
      VpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
        SecurityGroupIds:
          - { "Fn::ImportValue": !Sub "${NetworkStackName}-AdapterSecurityGroupId" }
      # Lambda's own async retry, on top of the idempotency lock. Two attempts
      # rather than the default two retries: the lock makes a duplicate harmless
      # but not free, and a job that fails twice is failing for a reason retrying
      # will not fix.
      Environment:
        Variables:
          JOB_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-JobTableName" }
          JOB_TTL_HOURS: { "Fn::ImportValue": !Sub "${DataStackName}-JobTtlHours" }
          GUARDRAIL_IDENTIFIER: { "Fn::ImportValue": !Sub "${BedrockStackName}-GuardrailId" }
          GUARDRAIL_VERSION: { "Fn::ImportValue": !Sub "${BedrockStackName}-GuardrailVersion" }
          INFERENCE_PROFILE_ARN:
            { "Fn::ImportValue": !Sub "${BedrockStackName}-ResponderInferenceProfileArn" }
          KNOWLEDGE_BASE_ID: { "Fn::ImportValue": !Sub "${BedrockStackName}-KnowledgeBaseId" }
          KB_RETRIEVE_ROLE_ARN: { "Fn::ImportValue": !Sub "${IdentityStackName}-KBRetrieveRoleArn" }
          KB_EXTERNAL_ID: !Ref KbRetrieveExternalId
          MAX_RETRIEVED_CHUNKS: "5"
          MAX_CONTEXT_CHARS: "24000"
          MAX_COMPLETION_TOKENS: !Ref MaxCompletionTokens
          RDS_PROXY_HOST: { "Fn::ImportValue": !Sub "${DataStackName}-ProxyEndpoint" }
          RDS_PROXY_PORT: "5432"
          DB_NAME: { "Fn::ImportValue": !Sub "${DataStackName}-DatabaseName" }
          DB_USER: !Sub "${ApplicationId}_app"
          LEDGER_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-LedgerTableName" }
          BUDGET_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-BudgetTableName" }
          CONTENT_TTL_DAYS: "30"
          METADATA_TTL_DAYS: "400"
          EGRESS_PROXY_FUNCTION: !Sub "${ApplicationId}-${Environment}-egress-proxy"
          EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
          SIMILARITY_THRESHOLD: "0.78"
          # Now that generation is off the API Gateway clock, the judge cap can
          # be set on its own merits rather than against a 29 s budget shared
          # with a sequential Converse call.
          JUDGE_TIMEOUT_MS: "25000"
          PG_POOL_MAX: "2"
          NODE_OPTIONS: "--enable-source-maps"
      TracingConfig:
        Mode: Active
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  WorkerAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      # Two hours, matching the job TTL default. A job whose payload has expired
      # is not worth retrying - the caller can no longer collect the result.
      MaximumEventAgeInSeconds: 7200
      DestinationConfig:
        OnFailure:
          # Terminal failures land here so a job stuck in PROCESSING is
          # detectable rather than silently abandoned.
          Destination: !GetAtt WorkerFailureQueue.Arn

  WorkerFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ApplicationId}-${Environment}-worker-failures"
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-VolatileKeyArn" }
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Egress proxy
  #
  # The only function in the egress subnets, and the only one with a route toward
  # the internet. It holds ApplyGuardrail and no inference permission: it can
  # guard a model call, not make one.
  # ==========================================================================
  EgressProxyFunction:
    Type: AWS::Lambda::Function
    DependsOn: EgressProxyLogGroup
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-egress-proxy"
      Runtime: nodejs24.x
      Handler: index.handler
      Role: { "Fn::ImportValue": !Sub "${IdentityStackName}-EgressProxyRoleArn" }
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "${ArtifactVersion}/egress-proxy.zip"
      # 26 s: the 25 s judge cap plus a second of overhead, still inside the
      # adapter's own 28 s budget.
      Timeout: 26
      MemorySize: 512
      ReservedConcurrentExecutions: !Ref EgressProxyReservedConcurrency
      VpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-EgressSubnetIds" }]
        SecurityGroupIds:
          - { "Fn::ImportValue": !Sub "${NetworkStackName}-EgressProxySecurityGroupId" }
      Environment:
        Variables:
          JUDGE_API_URL: !Ref JudgeApiUrl
          JUDGE_TIMEOUT_MS: "25000"
          # Name only. The value is fetched at runtime via GetSecretValue.
          JUDGE_API_KEY_SECRET: !Sub "${ApplicationId}/${Environment}/judge-api-key"
          GUARDRAIL_IDENTIFIER: { "Fn::ImportValue": !Sub "${BedrockStackName}-GuardrailId" }
          GUARDRAIL_VERSION: { "Fn::ImportValue": !Sub "${BedrockStackName}-GuardrailVersion" }
          LEDGER_TABLE: { "Fn::ImportValue": !Sub "${DataStackName}-LedgerTableName" }
          # Explicit. The code fails closed on a missing guardrail verdict; this
          # makes that behaviour a configured property rather than an implicit one.
          FAIL_CLOSED: "true"
          NODE_OPTIONS: "--enable-source-maps"
      TracingConfig:
        Mode: Active
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # The adapter reaches the proxy by direct Lambda invoke, not over the network.
  # This permission is what makes the hop a function-to-function call rather than
  # a routing decision - the adapter has no route to the egress subnets.
  EgressProxyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EgressProxyFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${AWS::AccountId}:root"
      SourceAccount: !Ref AWS::AccountId

  # ==========================================================================
  # Secrets rotation
  # ==========================================================================
  SecretsRotationFunction:
    Type: AWS::Lambda::Function
    DependsOn: SecretsRotationLogGroup
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-secrets-rotation"
      Runtime: nodejs24.x
      Handler: index.handler
      Role: { "Fn::ImportValue": !Sub "${IdentityStackName}-SecretsRotationRoleArn" }
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "${ArtifactVersion}/secrets-rotation.zip"
      Timeout: 120
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
        SecurityGroupIds:
          - { "Fn::ImportValue": !Sub "${NetworkStackName}-AdapterSecurityGroupId" }
      Environment:
        Variables:
          SECRETS_MANAGER_ENDPOINT:
            !Sub "https://secretsmanager.${AWS::Region}.amazonaws.com"
          NODE_OPTIONS: "--enable-source-maps"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  SecretsRotationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SecretsRotationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ==========================================================================
  # Lifecycle
  #
  # Two jobs: consume ledger stream deletions to write erasure receipts, and drop
  # expired Aurora partitions. Separate role from the adapter - it can delete
  # data but cannot read item content.
  # ==========================================================================
  LifecycleFunction:
    Type: AWS::Lambda::Function
    DependsOn: LifecycleLogGroup
    Properties:
      FunctionName: !Sub "${ApplicationId}-${Environment}-lifecycle"
      Runtime: nodejs24.x
      Handler: index.handler
      Role: { "Fn::ImportValue": !Sub "${IdentityStackName}-LifecycleRoleArn" }
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "${ArtifactVersion}/lifecycle.zip"
      Timeout: 300
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStackName}-ComputeSubnetIds" }]
        SecurityGroupIds:
          - { "Fn::ImportValue": !Sub "${NetworkStackName}-AdapterSecurityGroupId" }
      Environment:
        Variables:
          RDS_PROXY_HOST: { "Fn::ImportValue": !Sub "${DataStackName}-ProxyEndpoint" }
          DB_NAME: { "Fn::ImportValue": !Sub "${DataStackName}-DatabaseName" }
          DB_USER: !Sub "${ApplicationId}_lifecycle"
          RETAIN_MONTHS: "12"
          NODE_OPTIONS: "--enable-source-maps"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # TTL deletions arrive here as REMOVE records with userIdentity set to the
  # DynamoDB service principal, which is how an expiry is distinguished from an
  # application delete. The receipt written from these is the provable record of
  # what was deleted and when - TTL alone produces no such record.
  LedgerStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: { "Fn::ImportValue": !Sub "${DataStackName}-LedgerStreamArn" }
      FunctionName: !GetAtt LifecycleFunction.Arn
      StartingPosition: TRIM_HORIZON
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 60
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["REMOVE"]}'

  PartitionRotationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-partition-rotation"
      Description: Monthly Aurora partition create-and-drop
      ScheduleExpression: "cron(0 3 1 * ? *)"
      State: ENABLED
      Targets:
        - Id: lifecycle
          Arn: !GetAtt LifecycleFunction.Arn
          Input: '{"action":"rotate_partitions"}'

  PartitionRotationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LifecycleFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PartitionRotationSchedule.Arn

Outputs:
  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-AuthorizerFunctionArn" }
  AdapterFunctionArn:
    Value: !GetAtt AdapterFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-AdapterFunctionArn" }
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-WorkerFunctionArn" }
  WorkerFailureQueueArn:
    Value: !GetAtt WorkerFailureQueue.Arn
    Export: { Name: !Sub "${AWS::StackName}-WorkerFailureQueueArn" }
  EgressProxyFunctionArn:
    Value: !GetAtt EgressProxyFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-EgressProxyFunctionArn" }
  SecretsRotationFunctionArn:
    Value: !GetAtt SecretsRotationFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-SecretsRotationFunctionArn" }
  LifecycleFunctionArn:
    Value: !GetAtt LifecycleFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-LifecycleFunctionArn" }
