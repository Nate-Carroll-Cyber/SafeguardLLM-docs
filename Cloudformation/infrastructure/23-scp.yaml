AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 23 - Service Control Policies (spec section 15).

  DEPLOY TO THE MANAGEMENT ACCOUNT with all features enabled in the organization.

  The twelve controls do not fit in one policy - each SCP is capped at 5120
  characters. Split by domain rather than by remaining space, so the reason a
  given deny exists stays legible during an incident.

  SCPs constrain what an account CAN do; they grant nothing. An action must be
  allowed by both the SCP and an identity policy. They do not apply to the
  Management account, which is why workloads never run there.

Parameters:
  ApplicationId:
    Type: String
    Default: genai-workload
  WorkloadOuId:
    Type: String
    AllowedPattern: "^ou-[a-z0-9]{4,32}-[a-z0-9]{8,32}$"
  LogArchiveOuId:
    Type: String
    AllowedPattern: "^ou-[a-z0-9]{4,32}-[a-z0-9]{8,32}$"
  ApprovedRegions:
    Type: CommaDelimitedList
    Default: "us-east-1,us-west-2"
    Description: >
      Must include every region backing a cross-region inference profile. A
      profile whose backing region is denied here fails at runtime with an
      access-denied that looks like a permissions bug.
  GuardrailArnPattern:
    Type: String
    Default: "arn:aws:bedrock:*:*:guardrail/*"
  BreakGlassRoleName:
    Type: String
    Default: BreakGlass

Resources:

  # ==========================================================================
  # SCP 1 - Detective control protection
  # ==========================================================================
  ProtectDetectiveControlsPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub "${ApplicationId}-protect-detective-controls"
      Description: Prevents disabling or tampering with detection and audit
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref WorkloadOuId, !Ref LogArchiveOuId]
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyDisableDetection
            Effect: Deny
            Action:
              - guardduty:DeleteDetector
              - guardduty:DisassociateFromMasterAccount
              - guardduty:UpdateDetector
              - securityhub:DisableSecurityHub
              - securityhub:DisassociateFromMasterAccount
              - config:DeleteConfigurationRecorder
              - config:StopConfigurationRecorder
              - config:DeleteDeliveryChannel
              - macie2:DisableMacie
              - inspector2:Disable
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:PutEventSelectors
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn: !Sub "arn:aws:iam::*:role/${BreakGlassRoleName}"

  # ==========================================================================
  # SCP 2 - Audit and backup immutability
  # ==========================================================================
  ProtectAuditAndBackupPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub "${ApplicationId}-protect-audit-backup"
      Description: Object Lock, Vault Lock, key destruction, PITR
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref WorkloadOuId, !Ref LogArchiveOuId]
      Content:
        Version: "2012-10-17"
        Statement:
          # Deletion and lock-weakening are denied to everyone including root.
          # The deployment role is exempted for configuration actions only, so
          # that arming a lock and setting versioning on a new bucket remain
          # possible. Note the asymmetry: those actions can only tighten -
          # Object Lock and Vault Lock in compliance mode cannot be shortened
          # once set, so an exempted principal can arm and can never disarm.
          - Sid: DenyLockTampering
            Effect: Deny
            Action:
              - s3:PutObjectRetention
              - s3:PutObjectLegalHold
              - backup:DeleteRecoveryPoint
              - backup:DeleteBackupVault
              - backup:UpdateRecoveryPointLifecycle
              - backup:DeleteBackupVaultAccessPolicy
            Resource: "*"
          - Sid: DenyLockConfigurationExceptDeployment
            Effect: Deny
            Action:
              - s3:PutBucketObjectLockConfiguration
              - s3:PutBucketVersioning
              - backup:PutBackupVaultLockConfiguration
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::*:role/${BreakGlassRoleName}"
                  - "arn:aws:iam::*:role/*CfnServiceRole"
          # A key that cannot be scheduled for deletion is what makes Object Lock
          # meaningful: without this, an administrator renders every archived log
          # unreadable without deleting a single object.
          - Sid: DenyKeyDestruction
            Effect: Deny
            Action:
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:DisableKeyRotation
            Resource: "*"
          - Sid: DenyBackupDisablement
            Effect: Deny
            Action:
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DeleteTable
              - rds:DeleteDBCluster
              - rds:DeleteDBInstance
              - rds:ModifyDBCluster
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::*:role/${BreakGlassRoleName}"
                  - "arn:aws:iam::*:role/*CfnServiceRole"

  # ==========================================================================
  # SCP 3 - Inference governance
  #
  # The two conditions that make guardrail enforcement and cost attribution
  # non-optional across the OU, independent of any identity policy.
  # ==========================================================================
  InferenceGovernancePolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub "${ApplicationId}-inference-governance"
      Description: Guardrail and inference profile enforcement
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref WorkloadOuId]
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnguardedInference
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"
            Condition:
              "Null":
                bedrock:GuardrailIdentifier: "true"
          - Sid: DenyForeignGuardrail
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"
            Condition:
              ArnNotLike:
                bedrock:GuardrailIdentifier: !Ref GuardrailArnPattern
          # Forces every call through a tagged application inference profile.
          # Denying foundation-model ARNs directly is NOT the alternative: profiles
          # invoke the underlying model, so an ARN deny breaks them along with the
          # bypass it was meant to close.
          - Sid: DenyUnattributedInference
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"
            Condition:
              "Null":
                bedrock:InferenceProfileArn: "true"
          - Sid: DenyGuardrailDeletion
            Effect: Deny
            Action:
              - bedrock:DeleteGuardrail
            Resource: "*"

  # ==========================================================================
  # SCP 4 - Data protection and network boundary
  # ==========================================================================
  DataProtectionPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub "${ApplicationId}-data-protection"
      Description: Encryption, tagging, region, and network egress boundaries
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref WorkloadOuId]
      Content:
        Version: "2012-10-17"
        Statement:
          # Region restriction. Global services are exempted by NotAction - they
          # are only callable in us-east-1, so restricting them breaks IAM, STS,
          # CloudFront, and Route 53 across the whole OU.
          - Sid: DenyUnapprovedRegions
            Effect: Deny
            NotAction:
              - iam:*
              - sts:*
              - organizations:*
              - cloudfront:*
              - route53:*
              - waf-regional:*
              - wafv2:*
              - shield:*
              - support:*
              - budgets:*
              - ce:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref ApprovedRegions
              ArnNotLike:
                aws:PrincipalArn: !Sub "arn:aws:iam::*:role/${BreakGlassRoleName}"
          # Encryption at creation is NOT expressible as an SCP.
          # s3:x-amz-server-side-encryption is an object-level key, absent on
          # s3:CreateBucket and nonexistent for dynamodb:CreateTable, so a Null
          # check on it evaluates true for every create and denies all of them.
          # That is a self-inflicted outage, not a control.
          #
          # What an SCP CAN do is deny an unencrypted object write, where the key
          # is actually populated. Bucket-default and table-level encryption are
          # enforced by Config rules with auto-remediation and by cfn-guard at
          # build time - both of which can read the resource properties an SCP
          # cannot see.
          - Sid: DenyUnencryptedObjectWrites
            Effect: Deny
            Action: s3:PutObject
            Resource: "*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyUntaggedResources
            Effect: Deny
            Action:
              - s3:CreateBucket
              - dynamodb:CreateTable
              - lambda:CreateFunction
              - rds:CreateDBCluster
            Resource: "*"
            Condition:
              "Null":
                aws:RequestTag/costCenter: "true"
          # Keeps the no-default-route property from being undone by a later
          # change. Only the deployment role may create egress paths.
          - Sid: DenyEgressPathCreation
            Effect: Deny
            Action:
              - ec2:CreateInternetGateway
              - ec2:AttachInternetGateway
              - ec2:CreateNatGateway
              - ec2:CreateVpcPeeringConnection
              - ec2:AcceptVpcPeeringConnection
              - ec2:ModifyVpcEndpoint
              - ec2:DeleteVpcEndpoints
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn: "arn:aws:iam::*:role/*CfnServiceRole"
          # Root is denied by default. A total deny with no exception is the
          # common pattern and the wrong one: AWS reserves a handful of tasks
          # that ONLY root can perform - closing an account, changing the root
          # email, and restoring an S3 bucket policy that locked everyone out.
          # An unconditional deny means the organization cannot recover from
          # exactly the situations root exists for.
          #
          # NotAction leaves that narrow set reachable. Every use is a CloudTrail
          # event on an identity that should never appear, so the practical
          # control is alerting on root sign-in, not denying the last resort.
          - Sid: DenyRootUser
            Effect: Deny
            NotAction:
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:DeleteBucketPolicy
              - sqs:SetQueueAttributes
              - organizations:LeaveOrganization
              - account:*
              - iam:CreateVirtualMFADevice
              - iam:EnableMFADevice
              - iam:ChangePassword
              - support:*
            Resource: "*"
            Condition:
              StringLike:
                aws:PrincipalArn: "arn:aws:iam::*:root"

Outputs:
  ProtectDetectiveControlsPolicyId:
    Value: !Ref ProtectDetectiveControlsPolicy
  ProtectAuditAndBackupPolicyId:
    Value: !Ref ProtectAuditAndBackupPolicy
  InferenceGovernancePolicyId:
    Value: !Ref InferenceGovernancePolicy
  DataProtectionPolicyId:
    Value: !Ref DataProtectionPolicy
