AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 11 - Cross-account log delivery to the Log Archive bucket.

  Closes the spec section 10 deviation. Layers 01, 08, and 09 send WAF, Network
  Firewall, and VPC Flow Logs to workload-account CloudWatch groups, which are
  deletable by whoever compromised the workload account. This adds the export
  path: subscription filter -> Firehose -> Log Archive bucket under cmk/audit.

  Deploy to the WORKLOAD account, after layer 20 exists in the Log Archive
  account.

  CloudWatch is kept as a short-retention operational copy. The archive is the
  copy that survives a compromise of this account; CloudWatch is the one that is
  fast to query during an incident.

  VPC Flow Logs are deliberately excluded - GuardDuty consumes them directly, and
  their volume makes archive delivery expensive for low investigative value here.
  WAF and Network Firewall are security logs and do go to the archive.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  AuditBucketArn:
    Type: String
    Description: From layer 20 output AuditBucketArn
  AuditKeyArn:
    Type: String
    Description: From layer 20 output AuditKeyArn
  DeliveryPrefix:
    Type: String
    Description: From layer 20 output DeliveryPrefix, e.g. delivery/111122223333/
  KmsStackName:
    Type: String
  ApiStackName:
    Type: String
  BufferIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900

Resources:

  # ==========================================================================
  # Firehose delivery role
  #
  # PutObject only. The layer 20 bucket policy denies this account read, list,
  # and overwrite; this role does not request them either. Two independent
  # statements of the same intent, in two accounts.
  # ==========================================================================
  DeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-LogDeliveryRole"
      Description: Firehose delivery to the Log Archive account
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: firehose.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: cross-account-delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteToArchive
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                Resource:
                  - !Ref AuditBucketArn
                  - !Sub "${AuditBucketArn}/${DeliveryPrefix}*"
              # Encrypt only. GenerateDataKey without Decrypt means this identity
              # can write an object it can never read back.
              - Sid: EncryptOnly
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref AuditKeyArn
              - Sid: OwnErrorLogs
                Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:CreateLogStream
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/${ApplicationId}-${Environment}-*:*"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  FirehoseErrorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${ApplicationId}-${Environment}-archive"
      RetentionInDays: 30
      KmsKeyId: { "Fn::ImportValue": !Sub "${KmsStackName}-LogsKeyArn" }

  FirehoseErrorLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseErrorLogGroup
      LogStreamName: s3-delivery

  # ==========================================================================
  # WAF delivery
  # ==========================================================================
  WafDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      # WAF requires a stream name beginning aws-waf-logs-. Anything else is
      # rejected at association time with a generic error.
      DeliveryStreamName: !Sub "aws-waf-logs-${ApplicationId}-${Environment}-archive"
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Ref AuditBucketArn
        RoleARN: !GetAtt DeliveryRole.Arn
        Prefix: !Sub "${DeliveryPrefix}waf/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        ErrorOutputPrefix: !Sub "${DeliveryPrefix}waf-errors/"
        BufferingHints:
          IntervalInSeconds: !Ref BufferIntervalSeconds
          SizeInMBs: 64
        CompressionFormat: GZIP
        EncryptionConfiguration:
          KMSEncryptionConfig:
            AWSKMSKeyARN: !Ref AuditKeyArn
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseErrorLogGroup
          LogStreamName: !Ref FirehoseErrorLogStream
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  # Replaces the CloudWatch-only logging configuration from layer 08. Firehose is
  # the primary destination; the layer 08 log group stays as the operational copy.
  RegionalWafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: { "Fn::ImportValue": !Sub "${ApiStackName}-WebAclArn" }
      LogDestinationConfigs: [!GetAtt WafDeliveryStream.Arn]
      RedactedFields:
        # Without redaction the bearer token is written in full on every blocked
        # request - to an immutable bucket, where it cannot be removed.
        - SingleHeader: { Name: authorization }
        - SingleHeader: { Name: x-origin-verify }

  # ==========================================================================
  # Network Firewall delivery
  # ==========================================================================
  NetworkFirewallDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "${ApplicationId}-${Environment}-netfw-archive"
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Ref AuditBucketArn
        RoleARN: !GetAtt DeliveryRole.Arn
        Prefix: !Sub "${DeliveryPrefix}network-firewall/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        ErrorOutputPrefix: !Sub "${DeliveryPrefix}network-firewall-errors/"
        BufferingHints:
          IntervalInSeconds: !Ref BufferIntervalSeconds
          SizeInMBs: 64
        CompressionFormat: GZIP
        EncryptionConfiguration:
          KMSEncryptionConfig:
            AWSKMSKeyARN: !Ref AuditKeyArn
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseErrorLogGroup
          LogStreamName: !Ref FirehoseErrorLogStream
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # Bedrock model invocation log export
  #
  # The highest-sensitivity stream in the architecture: prompt and completion
  # bodies. It lands under its own prefix so the layer 20 bucket policy can
  # restrict reads to the named investigation role - a broad security-audit role
  # gets the rest of the bucket and not this.
  # ==========================================================================
  InvocationDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "${ApplicationId}-${Environment}-invocations-archive"
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Ref AuditBucketArn
        RoleARN: !GetAtt DeliveryRole.Arn
        Prefix: !Sub "${DeliveryPrefix}bedrock-invocations/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        ErrorOutputPrefix: !Sub "${DeliveryPrefix}bedrock-invocations-errors/"
        BufferingHints:
          IntervalInSeconds: !Ref BufferIntervalSeconds
          SizeInMBs: 64
        CompressionFormat: GZIP
        EncryptionConfiguration:
          KMSEncryptionConfig:
            AWSKMSKeyARN: !Ref AuditKeyArn
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseErrorLogGroup
          LogStreamName: !Ref FirehoseErrorLogStream
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: restricted }
        - { Key: owner, Value: !Ref Owner }

  SubscriptionFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationId}-${Environment}-LogSubscriptionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: firehose-put
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource:
                  - !GetAtt NetworkFirewallDeliveryStream.Arn
                  - !GetAtt InvocationDeliveryStream.Arn

  NetworkFirewallSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      LogGroupName: !Sub "/aws/network-firewall/${ApplicationId}-${Environment}/alert"
      # Everything. A filter here would decide at write time what is worth
      # keeping, which is the decision an investigation needs to make later.
      FilterPattern: ""
      DestinationArn: !GetAtt NetworkFirewallDeliveryStream.Arn
      RoleArn: !GetAtt SubscriptionFilterRole.Arn

  InvocationLogSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      LogGroupName: !Sub "/aws/bedrock/${ApplicationId}-${Environment}/invocations"
      FilterPattern: ""
      DestinationArn: !GetAtt InvocationDeliveryStream.Arn
      RoleArn: !GetAtt SubscriptionFilterRole.Arn

Outputs:
  WafDeliveryStreamArn:
    Value: !GetAtt WafDeliveryStream.Arn
  NetworkFirewallDeliveryStreamArn:
    Value: !GetAtt NetworkFirewallDeliveryStream.Arn
  InvocationDeliveryStreamArn:
    Value: !GetAtt InvocationDeliveryStream.Arn
  DeliveryRoleArn:
    Value: !GetAtt DeliveryRole.Arn
