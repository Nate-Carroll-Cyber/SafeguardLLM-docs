AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 09 - CloudFront, edge WAF, Route 53, Shield Advanced protection.

  DEPLOY THIS STACK TO us-east-1 REGARDLESS OF THE WORKLOAD REGION.
  A Scope: CLOUDFRONT WebACL can only exist in us-east-1, and so must the ACM
  certificate a distribution uses. That is why this stack takes the API endpoint
  as a parameter rather than importing it - Fn::ImportValue does not cross
  regions, so the value has to be passed in by the pipeline.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  ApplicationId:
    Type: String
    Default: genai-workload
  CostCenter:
    Type: String
  Owner:
    Type: String
  DataClassification:
    Type: String
    Default: confidential
  ApiEndpoint:
    Type: String
    Description: "<api-id>.execute-api.<region>.amazonaws.com from layer 08"
  ApiStageName:
    Type: String
  DomainName:
    Type: String
    Description: Public FQDN, e.g. api.example.com
  HostedZoneId:
    Type: String
  CertificateArn:
    Type: String
    Description: ACM certificate in us-east-1. A regional certificate is rejected.
  OriginVerifySecretValue:
    Type: String
    NoEcho: true
    Description: >
      Must match the value in the layer 08 WAF rule. The rotation function
      updates both in one operation; a manual change to one alone takes the
      API offline.
  EdgeRateLimitPerIp:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: >
      Per 5-minute window. Set well above the regional per-token limit - this
      counts every request from an IP including static assets, so a limit tuned
      like the regional one fires first on legitimate traffic.
  AnonymousIpAction:
    Type: String
    Default: count
    AllowedValues: [count, block]
    Description: >
      Start on count. This rule catches corporate VPNs and datacenter ranges,
      and MCP callers run in datacenters by definition. Blocking before
      measuring takes out legitimate machine traffic.
  GeoAllowList:
    Type: CommaDelimitedList
    Default: "US,CA,GB"
  GeoRestrictionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ShieldAdvancedEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Requires an active Shield Advanced subscription on the account. Enabling
      the protection resource without the subscription fails the stack.
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 90, 180, 365, 400]

Conditions:
  UseGeoRestriction: !Equals [!Ref GeoRestrictionEnabled, "true"]
  UseShieldAdvanced: !Equals [!Ref ShieldAdvancedEnabled, "true"]
  IsCountingAnonymousIp: !Equals [!Ref AnonymousIpAction, count]

Resources:

  # ==========================================================================
  # Edge WAF
  #
  # Independent of the regional WebACL - separate rules, separate counters,
  # separate logs, no shared state. What connects them is the request path, not
  # configuration: the regional WAF only sees traffic that survived this one AND
  # came through CloudFront. That is exactly why x-origin-verify exists.
  #
  # Rules absent here on purpose:
  #   x-origin-verify   - the header does not exist yet at this point
  #   per-tenant limits - no token parsing at the edge
  #   blocked-identity  - containment belongs where identity is known
  # ==========================================================================
  EdgeWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-edge"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ApplicationId}-${Environment}-edge"
      Rules:

        # Cheapest possible block: known-bad sources, no request inspection.
        - Name: ip-reputation
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation

        # Count by default. See the AnonymousIpAction parameter note.
        - Name: anonymous-ip
          Priority: 1
          OverrideAction: !If
            - IsCountingAnonymousIp
            - { Count: {} }
            - { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: anonymous-ip

        - !If
          - UseGeoRestriction
          - Name: geo-allow-list
            Priority: 2
            Action: { Block: { CustomResponse: { ResponseCode: 403 } } }
            Statement:
              NotStatement:
                Statement:
                  GeoMatchStatement:
                    CountryCodes: !Ref GeoAllowList
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: geo-allow-list
          - !Ref AWS::NoValue

        # Cuts scanner noise before any managed rule group is evaluated.
        - Name: method-allow-list
          Priority: 3
          Action: { Block: { CustomResponse: { ResponseCode: 405 } } }
          Statement:
            NotStatement:
              Statement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: GET
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: OPTIONS
                        TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: method-allow-list

        - Name: aws-common
          Priority: 4
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                # Prompts routinely exceed the default body-size rule. Body size
                # is bounded by the API Gateway request model and the adapter.
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Allow: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common

        - Name: aws-bad-inputs
          Priority: 5
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-bad-inputs

        # Blunt volumetric control on source IP. Per-tenant limiting stays
        # regional, where the token is available to key on.
        - Name: volumetric-rate-limit
          Priority: 6
          Action: { Block: { CustomResponse: { ResponseCode: 429 } } }
          Statement:
            RateBasedStatement:
              Limit: !Ref EdgeRateLimitPerIp
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: volumetric-rate-limit

      # SQLi and Linux rule sets are deliberately absent. There is no SQL string
      # concatenation and no shell exec anywhere in this workload; both groups
      # add WCU cost and fire on prose containing SQL keywords, which prompts do.
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  EdgeWafLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # The aws-waf-logs- prefix is mandatory; a different name is rejected at
      # association time with a generic error.
      LogGroupName: !Sub "aws-waf-logs-${ApplicationId}-${Environment}-edge"
      RetentionInDays: !Ref LogRetentionDays

  EdgeWafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt EdgeWebAcl.Arn
      LogDestinationConfigs: [!GetAtt EdgeWafLogGroup.Arn]
      RedactedFields:
        - SingleHeader: { Name: authorization }

  # ==========================================================================
  # CloudFront policies
  # ==========================================================================

  # Nothing is cached. A cached response on /v1/* would be a cross-tenant
  # disclosure with no attacker involved at all.
  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ApplicationId}-${Environment}-no-cache"
        Comment: API responses are never cached
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  # An explicit allow-list of what crosses into the region. Anything not named
  # here never reaches the adapter, which turns header smuggling into a problem
  # of defeating a whitelist rather than a blacklist.
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${ApplicationId}-${Environment}-origin-request"
        Comment: Allow-list of headers forwarded to the origin
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: none }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Authorization
            - Content-Type
            - X-Request-ID
            - Origin

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ApplicationId}-${Environment}-security-headers"
        Comment: Security response headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'"
            Override: true
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "geolocation=(), microphone=(), camera=()", Override: true }
            # Suppresses the default server banner from the origin.
            - { Header: Server, Value: "", Override: true }

  # ==========================================================================
  # Distribution
  # ==========================================================================
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ApplicationId} ${Environment} inference API"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        WebACLId: !GetAtt EdgeWebAcl.Arn
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          # Enforced at the TLS handshake, before WAF evaluates anything.
          MinimumProtocolVersion: TLSv1.2_2021
        Restrictions: !If
          - UseGeoRestriction
          - GeoRestriction:
              RestrictionType: whitelist
              Locations: !Ref GeoAllowList
          - GeoRestriction:
              RestrictionType: none
        Origins:
          - Id: api-gateway
            DomainName: !Ref ApiEndpoint
            OriginPath: !Sub "/${ApiStageName}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            # Injected here. The edge WAF runs before this point and never sees
            # the value, which is why the origin-verify check is regional-only.
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Ref OriginVerifySecretValue
        DefaultCacheBehavior:
          TargetOriginId: api-gateway
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref NoCachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          Compress: true
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

  # ==========================================================================
  # DNS
  # ==========================================================================
  AliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Fixed CloudFront hosted zone ID - global, not region-specific.
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  AliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  # ==========================================================================
  # Shield Advanced
  # ==========================================================================
  ShieldProtection:
    Type: AWS::Shield::Protection
    Condition: UseShieldAdvanced
    Properties:
      Name: !Sub "${ApplicationId}-${Environment}-distribution"
      ResourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      Tags:
        - { Key: costCenter, Value: !Ref CostCenter }
        - { Key: environment, Value: !Ref Environment }
        - { Key: applicationId, Value: !Ref ApplicationId }
        - { Key: dataClassification, Value: !Ref DataClassification }
        - { Key: owner, Value: !Ref Owner }

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Description: Pass to layer 08 as CloudFrontDistributionId for the resource policy
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  EdgeWebAclArn:
    Value: !GetAtt EdgeWebAcl.Arn
  PublicUrl:
    Value: !Sub "https://${DomainName}"
